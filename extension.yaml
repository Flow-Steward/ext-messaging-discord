manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.discord
kind: tool_provider
version: 0.1.1
release_stage: active
billing_mode: free
display_name: Discord
description: Read or update Discord resources from a Flow Steward workflow using the Discord REST v10 catalog.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-messaging-discord/issues
  website_url: https://github.com/Flow-Steward/ext-messaging-discord
listing:
  category: messaging
  categories: [messaging]
  tags: [discord, notifications, messaging]
  summary: Run Discord REST v10 actions for channels, servers, messages and applications.
  setup_summary: Add a Discord bot to your server and store its token in a project connection.
features: [tool, action]
required_scopes: [extension:invoke]
machine_auth:
  service_account_key: svc_ext_discord
  required_scopes: [extension:invoke]
account_scope:
  scope_type: project
  description: Each project connection selects a Discord bot, scoped OAuth2 token, or webhook or interaction credential.
egress:
  hosts: [discord.com]
external_effects:
  - operation_id: send_message
    effect_kind: discord_send_message
    channel: discord_rest_api
    idempotency: required
    test_mode_behavior: suppress
  - operation_id: discord_rest_write
    effect_kind: discord_rest_write
    channel: discord_rest_api
    idempotency: required
    test_mode_behavior: suppress
