connection_types:
  - connection_type_id: discord_bot
    display_name: Discord bot
    description: An application bot installed in your Discord server.
    auth:
      type: api_key
    config_schema:
      type: object
      additionalProperties: false
      properties: {}
    secret_schema:
      type: object
      additionalProperties: false
      required: [bot_token]
      properties:
        bot_token:
          type: string
          minLength: 1
          maxLength: 512
          title: Bot token
    capabilities:
      test_connection: true
