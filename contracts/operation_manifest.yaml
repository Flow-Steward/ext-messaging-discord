  - operation_id: rest_add_guild_member
    display_name: Add Guild Member
    description: 'Adds a user to the guild, provided you have a valid oauth2 access
      token for the user with the guilds.join scope. Returns a 201 Created with the
      guild member as the body, or 204 No Content if the user is already a member of
      the guild. Fires a Guild Member Add Gateway event. Discord: PUT /guilds/{guild_id}/members/{user_id}.'
    operation_kind: action
    category: messaging
    connection_type_ids:
    - discord_bot
    workflow_visible: true
    inputs:
    - name: connection_ref
      value_type: connection_ref
      required: true
    - name: guild_id
      value_type: text
      required: true
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
    - name: user_id
      value_type: text
      required: true
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
    - name: body
      value_type: object
      required: true
      schema:
        type: object
        properties:
          data:
            type: object
            properties:
              nick:
                type:
                - string
                - 'null'
                maxLength: 32
              roles:
                type:
                - array
                - 'null'
                maxItems: 250
                items:
                  type: string
                  pattern: ^(0|[1-9][0-9]*)$
              mute:
                type:
                - boolean
                - 'null'
              deaf:
                type:
                - boolean
                - 'null'
              flags:
                type:
                - integer
                - 'null'
              access_token:
                not: {}
            required: []
        required:
        - data
        additionalProperties: false
    - name: audit_reason
      value_type: text
      required: false
      schema:
        type: string
        maxLength: 512
    outputs:
    - name: response
      value_type: object
      schema:
        type: object
    - name: suppressed
      value_type: boolean
      schema:
        type: boolean
    - name: rate_limit
      value_type: object
      schema:
        type: object
    - name: warnings
      value_type: array
      schema:
        type: array
        items:
          type: string
    - name: processing
      value_type: text
      schema:
        type: string
    result_fields:
    - result.response
    - result.suppressed
    - result.rate_limit
    - result.warnings
    - result.processing
    error_codes:
    - invalid_payload
    - invalid_connection
    - upstream_validation_failed
    - authentication_failed
    - access_denied
    - not_found
    - rate_limited
    - provider_unavailable
    - timeout_unknown
    effect_kind: discord_add_guild_member
