  - operation_id: rest_update_webhook_message
    display_name: Edit Webhook Message
    description: 'Edits a previously-sent webhook message from the same token. Returns
      a message object on success. Discord: PATCH /webhooks/{webhook_id}/{webhook_token}/messages/{message_id}.'
    operation_kind: action
    category: messaging
    connection_type_ids:
    - discord_route_token
    workflow_visible: true
    inputs:
    - name: connection_ref
      value_type: connection_ref
      required: true
    - name: webhook_id
      value_type: text
      required: true
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
    - name: message_id
      value_type: text
      required: true
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
    - name: thread_id
      value_type: text
      required: false
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
    - name: with_components
      value_type: boolean
      required: false
      schema:
        type: boolean
    - name: body
      value_type: object
      required: false
      schema:
        type: object
        properties:
          data:
            anyOf:
            - type: object
              properties:
                content:
                  type: *id106
                  maxLength: 2000
                embeds:
                  type: *id107
                  maxItems: 10
                  items:
                    type: object
                    properties:
                      type:
                        type: *id023
                      url:
                        type: *id024
                      title:
                        type: *id025
                      color:
                        type: *id026
                      timestamp:
                        type: *id027
                      description:
                        type: *id028
                      author: {}
                      image: {}
                      thumbnail: {}
                      footer: {}
                      fields:
                        type: *id029
                      provider: {}
                      video: {}
                      audio: {}
                allowed_mentions:
                  oneOf:
                  - type: 'null'
                  - type: object
                    properties:
                      parse:
                        type: *id030
                      users:
                        type: *id031
                      roles:
                        type: *id032
                      replied_user:
                        type: *id033
                components:
                  type: *id108
                  maxItems: 40
                  items:
                    oneOf:
                    - type: object
                    - type: object
                    - type: object
                    - type: object
                    - type: object
                    - type: object
                    - type: object
                attachments:
                  type: *id109
                  maxItems: 10
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      filename:
                        type: *id034
                      description:
                        type: *id035
                      duration_secs:
                        type: *id036
                      waveform:
                        type: *id037
                      title:
                        type: *id038
                      is_spoiler:
                        type: *id039
                    required: *id040
                poll:
                  oneOf:
                  - type: 'null'
                  - type: object
                    properties:
                      question:
                        type: object
                      answers:
                        type: array
                      allow_multiselect:
                        type: *id041
                      layout_type: {}
                      duration:
                        type: *id042
                    required: *id043
                flags:
                  type: *id110
            - allOf:
              - type: object
                properties:
                  content:
                    type: *id106
                    maxLength: 2000
                  embeds:
                    type: *id107
                    maxItems: 10
                    items:
                      type: object
                  allowed_mentions:
                    oneOf:
                    - type: 'null'
                    - type: object
                  components:
                    type: *id108
                    maxItems: 40
                    items: {}
                  attachments:
                    type: *id109
                    maxItems: 10
                    items:
                      type: object
                  poll:
                    oneOf:
                    - type: 'null'
                    - type: object
                  flags:
                    type: *id110
              - type: object
                properties:
                  files[0]:
                    not: {}
                  files[1]:
                    not: {}
                  files[2]:
                    not: {}
                  files[3]:
                    not: {}
                  files[4]:
                    not: {}
                  files[5]:
                    not: {}
                  files[6]:
                    not: {}
                  files[7]:
                    not: {}
                  files[8]:
                    not: {}
                  files[9]:
                    not: {}
        required:
        - data
        additionalProperties: false
    - name: media_type
      value_type: text
      required: false
      schema:
        type: string
        enum:
        - application/json
        - application/x-www-form-urlencoded
        - multipart/form-data
    - name: files
      value_type: array
      required: false
      schema:
        type: array
        maxItems: 10
        items:
          type: object
          required:
          - field
          - filename
          - data_base64
          properties:
            field:
              type: string
            filename:
              type: string
            data_base64:
              type: string
          additionalProperties: false
    - name: file_artifacts
      value_type: array
      required: false
      schema:
        type: array
        maxItems: 10
        items:
          type: object
          required:
          - field
          - filename
          - artifact_handle
          properties:
            field:
              type: string
            filename:
              type: string
            artifact_handle:
              type: string
          additionalProperties: false
    - name: audit_reason
      value_type: text
      required: false
      schema:
        type: string
        maxLength: 512
    outputs:
    - name: response
      value_type: object
      schema:
        type: object
    - name: suppressed
      value_type: boolean
      schema:
        type: boolean
    - name: rate_limit
      value_type: object
      schema:
        type: object
    - name: warnings
      value_type: array
      schema:
        type: array
        items:
          type: string
    - name: processing
      value_type: text
      schema:
        type: string
    result_fields:
    - result.response
    - result.suppressed
    - result.rate_limit
    - result.warnings
    - result.processing
    error_codes:
    - invalid_payload
    - invalid_connection
    - upstream_validation_failed
    - authentication_failed
    - access_denied
    - not_found
    - rate_limited
    - provider_unavailable
    - timeout_unknown
    effect_kind: discord_update_webhook_message
