# Generated Discord REST actions. Run scripts/build_actions.py.
  - operation_id: rest_action_guild_join_request
    display_name: Action guild join request
    description: Discord REST v10 PATCH /guilds/{guild_id}/requests/{request_id}
    operation_kind: action
    category: messaging
    connection_type_ids:
    - discord_bot
    workflow_visible: true
    inputs:
    - name: connection_ref
      value_type: connection_ref
      required: true
    - name: guild_id
      value_type: text
      required: true
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
    - name: request_id
      value_type: text
      required: true
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
    - name: body
      value_type: object
      required: true
      schema:
        type: object
        properties:
          data:
            type: object
            properties:
              action:
                type: string
                enum: []
                allOf:
                - type: string
                  oneOf:
                  - const: STARTED
                  - const: SUBMITTED
                  - const: REJECTED
                  - const: APPROVED
              rejection_reason:
                type:
                - string
                - 'null'
                maxLength: 160
        required:
        - data
        additionalProperties: false
    - name: audit_reason
      value_type: text
      required: false
      schema:
        type: string
        maxLength: 512
    outputs:
    - name: response
      value_type: object
      schema:
        type: object
    - name: suppressed
      value_type: boolean
      schema:
        type: boolean
    - name: rate_limit
      value_type: object
      schema:
        type: object
    - name: warnings
      value_type: array
      schema:
        type: array
        items:
          type: string
    - name: processing
      value_type: text
      schema:
        type: string
    result_fields:
    - result.response
    - result.suppressed
    - result.rate_limit
    - result.warnings
    - result.processing
    error_codes:
    - invalid_payload
    - invalid_connection
    - upstream_validation_failed
    - authentication_failed
    - access_denied
    - not_found
    - rate_limited
    - provider_unavailable
    - timeout_unknown
    effect_kind: discord_action_guild_join_request
