    - access_denied
    - not_found
    - rate_limited
    - provider_unavailable
    - invalid_response
    - response_too_large
  - operation_id: list_messages
    display_name: List channel messages
    description: 'Reads the messages of a channel, newest first; with all_pages the whole history, page after page. Discord: GET /channels/{channel_id}/messages.'
    operation_kind: source
    category: messaging
    connection_type_ids:
    - discord_bot
    workflow_visible: true
    inputs:
    - name: connection_ref
      value_type: connection_ref
      required: true
    - name: channel_id
      value_type: text
      required: true
      schema:
        type: string
        pattern: ^[0-9]{1,20}$
    - name: limit
      value_type: integer
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    - name: before
      value_type: text
      required: false
      schema:
        type: string
        pattern: ^[0-9]{1,20}$
    - name: after
      value_type: text
      required: false
      schema:
        type: string
        pattern: ^[0-9]{1,20}$
    - name: around
      value_type: text
      required: false
      schema:
        type: string
        pattern: ^[0-9]{1,20}$
    - name: all_pages
      value_type: boolean
      required: false
      schema:
        type: boolean
    outputs:
    - name: items
      value_type: array
      schema:
        type: array
        items:
          type: object
    - name: next_cursor
      value_type: text
      schema:
        type: string
    - name: complete
      value_type: boolean
      schema:
        type: boolean
    - name: pages
      value_type: integer
      schema:
        type: integer
    - name: rate_limit
      value_type: object
      schema:
        type: object
    - name: warnings
      value_type: array
      schema:
        type: array
        items:
          type: string
    result_fields:
    - result.items
    - result.next_cursor
    - result.complete
    - result.pages
    - result.rate_limit
    - result.warnings
    error_codes:
    - invalid_payload
    - upstream_validation_failed
    - invalid_connection
    - authentication_failed
    - access_denied
    - not_found
    - rate_limited
    - provider_unavailable
    - invalid_response
