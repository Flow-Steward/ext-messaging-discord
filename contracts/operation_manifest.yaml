                  type: &id082
                  - string
                  - 'null'
                  maxLength: 4000
                embeds:
                  type: &id083
                  - array
                  - 'null'
                  maxItems: 10
                  items:
                    type: object
                    properties:
                      type:
                        type: *id023
                      url:
                        type: *id024
                      title:
                        type: *id025
                      color:
                        type: *id026
                      timestamp:
                        type: *id027
                      description:
                        type: *id028
