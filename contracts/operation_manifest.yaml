    display_name: Add a Member to a Lobby
    description: 'Adds the provided user to the specified lobby. If called when the
      user is already a member of the lobby will update fields such as metadata on that
      user instead. Discord: PUT /lobbies/{lobby_id}/members/{user_id}.'
    operation_kind: action
    category: messaging
    connection_type_ids:
    - discord_bot
    workflow_visible: true
    inputs:
    - name: connection_ref
      value_type: connection_ref
      required: true
    - name: lobby_id
      value_type: text
      required: true
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
    - name: user_id
      value_type: text
      required: true
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
    - name: body
      value_type: object
      required: true
      schema:
        type: object
        properties:
          data:
            type: object
            properties:
              metadata:
                type:
                - object
                - 'null'
                additionalProperties:
                  type: string
                  maxLength: 1024
              flags:
                oneOf:
                - type: 'null'
                - type: integer
                  enum:
                  - 1
              additional_name:
                type:
                - string
                - 'null'
                minLength: 1
                maxLength: 80
        required:
        - data
        additionalProperties: false
    - name: audit_reason
      value_type: text
      required: false
      schema:
        type: string
        maxLength: 512
    outputs:
