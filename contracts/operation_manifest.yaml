  - operation_id: rest_get_sku_subscriptions
    display_name: List SKU Subscriptions
    description: 'Returns all subscriptions containing the SKU, filtered by user. Returns
      a list of subscription objects. Discord: GET /skus/{sku_id}/subscriptions. With
      all_pages it reads every page (after the step''s cursor, or from the first item
      without one) and returns next_cursor to pass as after when the list did not end.'
    operation_kind: source
    category: messaging
    connection_type_ids:
    - discord_bot
    - discord_oauth_token
    workflow_visible: true
    inputs:
    - name: connection_ref
      value_type: connection_ref
      required: true
    - name: sku_id
      value_type: text
      required: true
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
    - name: after
      value_type: text
      required: false
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
    - name: before
      value_type: text
      required: false
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
    - name: limit
      value_type: integer
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    - name: user_id
      value_type: text
      required: false
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
    - name: all_pages
      value_type: boolean
      required: false
      schema:
        type: boolean
    outputs:
    - name: response
      value_type: object
      schema:
        type: object
    - name: suppressed
      value_type: boolean
      schema:
        type: boolean
    - name: rate_limit
      value_type: object
      schema:
        type: object
    - name: warnings
      value_type: array
      schema:
        type: array
        items:
          type: string
    - name: next_cursor
      value_type: text
      schema:
        type: string
    - name: complete
      value_type: boolean
      schema:
        type: boolean
    - name: pages
      value_type: integer
      schema:
        type: integer
    result_fields:
    - result.response
    - result.suppressed
    - result.rate_limit
    - result.warnings
    - result.next_cursor
    - result.complete
    - result.pages
