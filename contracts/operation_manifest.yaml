    description: 'Reads a channel by its ID (name, type, topic, parent, permissions). Discord: GET /channels/{channel_id}.'
    operation_kind: source
    category: messaging
    connection_type_ids:
    - discord_bot
    workflow_visible: true
    inputs:
    - name: connection_ref
      value_type: connection_ref
      required: true
    - name: channel_id
      value_type: text
      required: true
      schema:
        type: string
        pattern: ^[0-9]{1,20}$
    outputs:
    - name: item
      value_type: object
      schema:
        type: object
    - name: rate_limit
      value_type: object
      schema:
        type: object
    - name: warnings
      value_type: array
      schema:
        type: array
        items:
          type: string
    result_fields:
    - result.item
    - result.rate_limit
    - result.warnings
    error_codes:
