    - name: query_parameters
      value_type: object
      required: false
    - name: body
      value_type: object
      required: false
    - name: media_type
      value_type: text
      required: false
    - name: files
      value_type: array
      required: false
    - name: file_artifacts
      value_type: array
      required: false
      schema:
        type: array
        maxItems: 10
        items:
          type: object
          required:
