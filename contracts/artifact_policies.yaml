# Workflow files a step may upload to Discord (the file_artifacts input). Each grant
# is read with read_artifact_bytes; each file is at most 20 MiB, Discord's default upload
# limit per file, and a request carries at most ten files.
policies:
  - operation_id: discord_rest_write
    inputs:
      - kind: artifact
        value_type: artifact_handle
        binding_key: discord_file
        field: file_artifacts
        required: false
        max_size_bytes: 20971520
