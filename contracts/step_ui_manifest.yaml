forms:
- operation_id: test_connection
  title: Test connection
  fields: []
- operation_id: send_message
  title: Send message
  fields:
  - name: channel_id
    label: Channel ID
    widget_type: text
    required: true
    help_text: The ID of the channel (a Discord snowflake, digits only).
  - name: content
    label: Message text
    widget_type: textarea
    required: true
    help_text: The text of the message, up to 2000 characters.
- operation_id: get_channel
  title: Get channel
  fields:
  - name: channel_id
    label: Channel ID
    widget_type: text
    required: true
    help_text: The ID of the channel (a Discord snowflake, digits only).
- operation_id: list_messages
  title: List channel messages
  fields:
  - name: channel_id
    label: Channel ID
    widget_type: text
    required: true
    help_text: The ID of the channel (a Discord snowflake, digits only).
  - name: limit
    label: Limit
    widget_type: number
    required: false
    help_text: Max number of messages to return (1-100)
  - name: before
    label: Before
    widget_type: text
    required: false
    help_text: Get messages before this message ID
  - name: after
    label: After
    widget_type: text
    required: false
    help_text: Get messages after this message ID
  - name: around
    label: Around
    widget_type: text
    required: false
    help_text: Get messages around this message ID
  - name: all_pages
    label: All pages
    widget_type: boolean
    required: false
    help_text: Read page after page until Discord's list ends, or the step's time or output is used up;
      then complete is false and next_cursor says where to continue.
- operation_id: get_guild
  title: Get server
  fields:
  - name: guild_id
    label: Guild ID
    widget_type: text
    required: true
    help_text: The ID of the server (a Discord snowflake, digits only).
  - name: with_counts
    label: With counts
    widget_type: boolean
    required: false
    help_text: When true, will return approximate member and presence counts for the guild
- operation_id: list_guild_channels
  title: List server channels
  fields:
  - name: guild_id
    label: Guild ID
    widget_type: text
    required: true
    help_text: The ID of the server (a Discord snowflake, digits only).
