forms:
  - operation_id: test_connection
    title: Test connection
    fields: []
  - operation_id: send_message
    title: Send message
    fields:
      - {name: channel_id, label: Channel ID, widget_type: text, required: true}
      - {name: content, label: Message, widget_type: textarea, required: true}
  - operation_id: get_channel
    title: Get channel
    fields:
    - name: channel_id
      label: Channel id
      widget_type: text
      required: true
  - operation_id: list_messages
    title: List channel messages
    fields:
    - name: channel_id
      label: Channel id
      widget_type: text
      required: true
    - name: limit
      label: Limit
      widget_type: number
      required: false
    - name: before
      label: Before
      widget_type: text
      required: false
    - name: after
      label: After
      widget_type: text
      required: false
    - name: around
      label: Around
      widget_type: text
      required: false
  - operation_id: get_guild
    title: Get server
    fields:
    - name: guild_id
      label: Guild id
      widget_type: text
      required: true
    - name: with_counts
      label: With counts
      widget_type: boolean
      required: false
  - operation_id: list_guild_channels
    title: List server channels
    fields:
    - name: guild_id
      label: Guild id
      widget_type: text
      required: true
  - operation_id: discord_rest_read
    title: Run Discord REST read
    fields:
    - name: operation_id
      label: Operation ID
      widget_type: text
      required: true
    - name: path_parameters
      label: Path parameters
      widget_type: json
      required: false
    - name: query_parameters
      label: Query parameters
      widget_type: json
      required: false
  - operation_id: discord_rest_write
    title: Run Discord REST write
    fields:
    - name: operation_id
      label: Operation ID
      widget_type: text
      required: true
    - name: path_parameters
      label: Path parameters
      widget_type: json
      required: false
    - name: query_parameters
      label: Query parameters
      widget_type: json
      required: false
    - name: body
      label: JSON or form body
      widget_type: json
      required: false
    - name: media_type
      label: Request media type
      widget_type: text
      required: false
    - name: files
      label: Multipart files
      widget_type: json
      required: false
    - name: audit_reason
      label: Audit log reason
      widget_type: text
      required: false
