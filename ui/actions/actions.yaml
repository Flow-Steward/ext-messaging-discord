actions:
  - action_id: test_connection
    title: Test connection
    required_scopes: [extension:invoke]
    handler: {mode: extension}
    mutates_platform: false
    workflow_visible: true
    parameters:
      - {name: connection_ref, type: connection_ref, required: true}
    result_fields: [bot_id]
    error_codes: [invalid_payload, upstream_validation_failed, invalid_connection, authentication_failed, access_denied, not_found, rate_limited, provider_unavailable]
  - action_id: send_message
    title: Send message
    required_scopes: [extension:invoke]
    handler: {mode: extension}
    command_type: invoke_extension_action
    mutates_platform: true
    workflow_visible: true
    parameters:
      - {name: connection_ref, type: connection_ref, required: true}
      - {name: channel_id, type: string, required: true}
      - {name: content, type: string, required: true}
    result_fields: [message_id, channel_id, suppressed]
    error_codes: [invalid_payload, upstream_validation_failed, invalid_connection, authentication_failed, access_denied, not_found, rate_limited, provider_unavailable, timeout_unknown]
  - action_id: get_channel
    title: Get channel
    required_scopes:
    - extension:invoke
    handler:
      mode: extension
    mutates_platform: false
    workflow_visible: true
    parameters:
    - name: connection_ref
      type: connection_ref
      required: true
    - name: channel_id
      type: string
      required: true
    result_fields:
    - item
    error_codes:
    - invalid_payload
    - upstream_validation_failed
    - invalid_connection
    - authentication_failed
    - access_denied
    - not_found
    - rate_limited
    - provider_unavailable
  - action_id: list_messages
    title: List channel messages
    required_scopes:
    - extension:invoke
    handler:
      mode: extension
    mutates_platform: false
    workflow_visible: true
    parameters:
    - name: connection_ref
      type: connection_ref
      required: true
    - name: channel_id
      type: string
      required: true
    - name: limit
      type: integer
      required: false
    - name: before
      type: string
      required: false
    - name: after
      type: string
      required: false
    - name: around
      type: string
      required: false
    result_fields:
    - items
    error_codes:
    - invalid_payload
    - upstream_validation_failed
    - invalid_connection
    - authentication_failed
    - access_denied
    - not_found
    - rate_limited
    - provider_unavailable
  - action_id: get_guild
    title: Get server
    required_scopes:
    - extension:invoke
    handler:
      mode: extension
    mutates_platform: false
    workflow_visible: true
    parameters:
    - name: connection_ref
      type: connection_ref
      required: true
    - name: guild_id
      type: string
      required: true
    - name: with_counts
      type: boolean
      required: false
    result_fields:
    - item
    error_codes:
    - invalid_payload
    - upstream_validation_failed
    - invalid_connection
    - authentication_failed
    - access_denied
    - not_found
    - rate_limited
    - provider_unavailable
  - action_id: list_guild_channels
    title: List server channels
    required_scopes:
    - extension:invoke
    handler:
      mode: extension
    mutates_platform: false
    workflow_visible: true
    parameters:
    - name: connection_ref
      type: connection_ref
      required: true
    - name: guild_id
      type: string
      required: true
    result_fields:
    - items
    error_codes:
    - invalid_payload
    - upstream_validation_failed
    - invalid_connection
    - authentication_failed
    - access_denied
    - not_found
    - rate_limited
    - provider_unavailable
  - action_id: discord_rest_read
    title: Run Discord REST read
    required_scopes:
    - extension:invoke
    handler:
      mode: extension
    mutates_platform: false
    workflow_visible: true
    parameters:
    - name: connection_ref
      type: connection_ref
      required: true
    - name: operation_id
      type: string
      required: true
    - name: path_parameters
      type: object
      required: false
    - name: query_parameters
      type: object
      required: false
    result_fields:
    - response
    - suppressed
    error_codes:
    - invalid_payload
    - invalid_connection
    - upstream_validation_failed
    - authentication_failed
    - access_denied
    - not_found
    - rate_limited
    - provider_unavailable
    - timeout_unknown
  - action_id: discord_rest_write
    title: Run Discord REST write
    required_scopes:
    - extension:invoke
    handler:
      mode: extension
    mutates_platform: true
    workflow_visible: true
    parameters:
    - name: connection_ref
      type: connection_ref
      required: true
    - name: operation_id
      type: string
      required: true
    - name: path_parameters
      type: object
      required: false
    - name: query_parameters
      type: object
      required: false
    - name: body
      type: object
      required: false
    - name: media_type
      type: string
      required: false
    - name: files
      type: array
      required: false
    - name: audit_reason
      type: string
      required: false
    result_fields:
    - response
    - suppressed
    error_codes:
    - invalid_payload
    - invalid_connection
    - upstream_validation_failed
    - authentication_failed
    - access_denied
    - not_found
    - rate_limited
    - provider_unavailable
    - timeout_unknown
    command_type: invoke_extension_action
