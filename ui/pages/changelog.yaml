page_id: changelog
title: Changelog
description: What changed in each release of this extension.
components:
- component_id: changelog_entries
  type: markdown
  title: Release history
  body: |
    ## 0.1.2

    - Every step has Discord's own name and description, and every input a label and help text; the same input reads the same in every step.
    - New pages: Setup Guide, a page for each connection type, the Discord API by group with every step, Coverage and this Changelog.

    ## 0.1.1

    - The Support page, and the catalog categories.

    ## 0.1.0

    - All 258 operations of the Discord REST API v10 as steps: the 250 of the pinned API description and 8 from Discord's documentation.
    - Everyday steps: test the connection, send a message, get a channel, list a channel's messages, get a server, list its channels.
    - Lists read all pages with `all_pages`; files up to 20 MiB each from workflow files; Discord's rate limits in every result.
    - Changes are sent once and never retried automatically; test runs never send them.
