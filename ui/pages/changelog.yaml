page_id: changelog
title: Changelog
description: What changed in each release of this extension.
project_scoped: false
components:
- component_id: changelog_entries
  type: markdown
  title: Release history
  body: |
    ## 0.1.5

    - Reference pages open without choosing a project; only the connection pages ask for one.

    ## 0.1.4

    - The Discord API is one tab: every step by group in sections you open, one line per step with what it does.
    - A Discord answer such as "not found" or "missing access" is reported as an ordinary step error, so a few of them in a row no longer pause the extension.

    ## 0.1.3

    - The release archive passes the Flow Steward catalog check.

    ## 0.1.2

    - Every step has Discord's own name and description, and every input a label and help text; the same input reads the same in every step.
    - New pages: a detailed Setup Guide, a page for each connection type with its form, the Discord API by group with every step, Discord API coverage with every operation's endpoint, inputs and returned fields, and this Changelog.
    - Connection forms show the saved connection and its name.

    ## 0.1.1

    - The Support page, and the catalog categories.

    ## 0.1.0

    - All 258 operations of the Discord REST API v10 as steps: the 250 of the pinned API description and 8 from Discord's documentation.
    - Everyday steps: test the connection, send a message, get a channel, list a channel's messages, get a server, list its channels.
    - Lists read all pages with `all_pages`; files up to 20 MiB each from workflow files; Discord's rate limits in every result.
    - Changes are sent once and never retried automatically; test runs never send them.
