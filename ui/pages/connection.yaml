page_id: connection
title: Connection
description: Connect a Discord bot. Most steps act as the bot.
components:
  - component_id: discord_bot_connection
    type: connection_form
    title: Discord bot
    description: Paste the bot token and test the connection. Flow Steward stores it as a secret and never shows it again.
    data:
      connection_kind: extension
      connection_type: discord_bot
      config_fields: []
      secret_fields: [bot_token]
      test_action: test_connection
    fields:
      - path: bot_token
        widget: secret
        label: Bot token
        required: true
    ui_schema:
      actions:
        test_label: Test connection
  - component_id: discord_bot_when
    type: markdown
    title: When you need it
    body: |
      For almost every step: messages, channels and threads, servers and members, roles, moderation, webhooks, emojis and stickers, scheduled events and application commands. The bot acts in the servers it was added to, with the permissions of its role.

      The token is on the **Bot** page of your application in the [Discord Developer Portal](https://discord.com/developers/applications) (**Reset Token**). See **Setup Guide** for intents, permissions and adding the bot to a server.
  - component_id: discord_bot_help
    type: markdown
    title: If it fails
    body: |
      - **Test connection fails with authentication_failed** — the token is wrong or was reset. Reset it in the Developer Portal and paste the new one.
      - **A step is refused with access_denied** — the bot lacks a permission in that server or channel, or the target role is above the bot's role.
      - **Messages come back with empty content** — turn on **Message Content Intent** for the bot.
      - **rate_limited** — Discord asks to wait; the step says how long.
