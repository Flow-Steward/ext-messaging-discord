title: 'Discord API: Servers and members'
description: The 42 servers and members steps.
components:
- component_id: steps_guilds
  type: markdown
  title: Servers and members
  body: |
    Read and change servers, their members, onboarding, widgets, templates and voice states.

    ### Add Guild Member

    Adds a user to the guild, provided you have a valid oauth2 access token for the user with the guilds.join scope. Returns a 201 Created with the guild member as the body, or 204 No Content if the user is already a member of the guild. Fires a Guild Member Add Gateway event. Discord: PUT /guilds/{guild_id}/members/{user_id}.

    Action id `rest_add_guild_member` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `user_id`, `body`, `audit_reason`.

    ### Modify Guild Channel Positions

    Modify the positions of a set of channel objects for the guild. Requires MANAGE_CHANNELS permission. Returns a 204 empty response on success. Fires multiple Channel Update Gateway events. Discord: PATCH /guilds/{guild_id}/channels.

    Action id `rest_bulk_update_guild_channels` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Create Guild Channel

    Create a new channel object for the guild. Requires the MANAGE_CHANNELS permission. If setting permission overwrites, only permissions your bot has in the guild can be allowed/denied. Setting MANAGE_ROLES permission in channels is only possible for guild administrators. Returns the new channel object on success. Fires a Channel Create Gateway event. Discord: POST /guilds/{guild_id}/channels.

    Action id `rest_create_guild_channel` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Create Guild Template

    Creates a template for the guild. Requires the MANAGE_GUILD permission. Returns the created guild template object on success. Discord: POST /guilds/{guild_id}/templates.

    Action id `rest_create_guild_template` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Delete Guild Integration

    Delete the attached integration object for the guild. Deletes any associated webhooks and kicks the associated bot if there is one. Requires the MANAGE_GUILD permission. Returns a 204 empty response on success. Fires Guild Integrations Update and Integration Delete Gateway events. Discord: DELETE /guilds/{guild_id}/integrations/{integration_id}.

    Action id `rest_delete_guild_integration` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `integration_id`, `audit_reason`.

    ### Remove Guild Member

    Remove a member from a guild. Requires KICK_MEMBERS permission. Returns a 204 empty response on success. Fires a Guild Member Remove Gateway event. Discord: DELETE /guilds/{guild_id}/members/{user_id}.

    Action id `rest_delete_guild_member` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `user_id`, `audit_reason`.

    ### Delete Guild Template

    Deletes the template. Requires the MANAGE_GUILD permission. Returns the deleted guild template object on success. Discord: DELETE /guilds/{guild_id}/templates/{code}.

    Action id `rest_delete_guild_template` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `code`, `audit_reason`.

    ### Get Guild

    Returns the guild object for the given id. If with_counts is set to true, this endpoint will also return approximate_member_count and approximate_presence_count for the guild. Discord: GET /guilds/{guild_id}.

    Action id `rest_get_guild` · reads only · connection: bot

    Inputs: `guild_id`, `with_counts`.

    ### Get Guild Member

    Returns a guild member object for the specified user. Discord: GET /guilds/{guild_id}/members/{user_id}.

    Action id `rest_get_guild_member` · reads only · connection: bot

    Inputs: `guild_id`, `user_id`.

    ### Get Guild Member Permissions

    Returns the member's computed guild permissions, combining their roles with @everyone. Discord: GET /guilds/{guild_id}/permissions/member/{user_id}.

    Action id `rest_get_guild_member_permissions` · reads only · connection: bot

    Inputs: `guild_id`, `user_id`.

    ### Get Guild New Member Welcome

    Returns the server's welcome settings for new members. Discord: GET /guilds/{guild_id}/new-member-welcome.

    Action id `rest_get_guild_new_member_welcome` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Get Guild Preview

    Returns the guild preview object for the given id. If the user is not in the guild, then the guild must be discoverable. Discord: GET /guilds/{guild_id}/preview.

    Action id `rest_get_guild_preview` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Get Guild Role Permissions

    Returns the combined guild permissions of the specified role and @everyone. This calculation does not include other roles or member-specific restrictions. Discord: GET /guilds/{guild_id}/permissions/role/{role_id}.

    Action id `rest_get_guild_role_permissions` · reads only · connection: bot

    Inputs: `guild_id`, `role_id`.

    ### Get Guild Template

    Returns a guild template object for the given code. Discord: GET /guilds/templates/{code}.

    Action id `rest_get_guild_template` · reads only · connection: bot

    Inputs: `code`.

    ### Get Guild Vanity URL

    Returns a partial invite object for guilds with that feature enabled. Requires the MANAGE_GUILD permission. code will be null if a vanity url for the guild is not set. Discord: GET /guilds/{guild_id}/vanity-url.

    Action id `rest_get_guild_vanity_url` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Get Guild Welcome Screen

    Returns the Welcome Screen object for the guild. If the welcome screen is not enabled, the MANAGE_GUILD permission is required. Discord: GET /guilds/{guild_id}/welcome-screen.

    Action id `rest_get_guild_welcome_screen` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Get Guild Widget

    Returns the widget for the guild. Fires an Invite Create Gateway event when an invite channel is defined and a new Invite is generated. Discord: GET /guilds/{guild_id}/widget.json.

    Action id `rest_get_guild_widget` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Get Guild Widget Image

    Returns a PNG image widget for the guild. Requires no permissions or authentication. Discord: GET /guilds/{guild_id}/widget.png.

    Action id `rest_get_guild_widget_png` · reads only · connection: bot

    Inputs: `guild_id`, `style`.

    ### Get Guild Widget Settings

    Returns a guild widget settings object. Requires the MANAGE_GUILD permission. Discord: GET /guilds/{guild_id}/widget.

    Action id `rest_get_guild_widget_settings` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Get Guild Onboarding

    Returns the Onboarding object for the guild. Discord: GET /guilds/{guild_id}/onboarding.

    Action id `rest_get_guilds_onboarding` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Get Current User Voice State

    Returns the current user's voice state in the guild. Discord: GET /guilds/{guild_id}/voice-states/@me.

    Action id `rest_get_self_voice_state` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Get User Voice State

    Returns the specified user's voice state in the guild. Discord: GET /guilds/{guild_id}/voice-states/{user_id}.

    Action id `rest_get_voice_state` · reads only · connection: bot

    Inputs: `guild_id`, `user_id`.

    ### Get Guild Channels

    Returns a list of guild channel objects. Does not include threads. Discord: GET /guilds/{guild_id}/channels.

    Action id `rest_list_guild_channels` · reads only · connection: bot, OAuth2 token

    Inputs: `guild_id`.

    ### Get Guild Integrations

    Returns a list of integration objects for the guild. Requires the MANAGE_GUILD permission. Discord: GET /guilds/{guild_id}/integrations.

    Action id `rest_list_guild_integrations` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Get Guild Invites

    Returns a list of invite objects. Requires the MANAGE_GUILD or VIEW_AUDIT_LOG permission. Invite Metadata is included with the MANAGE_GUILD permission. Discord: GET /guilds/{guild_id}/invites.

    Action id `rest_list_guild_invites` · reads only · connection: bot

    Inputs: `guild_id`.

    ### List Guild Members

    Returns a list of guild member objects that are members of the guild. Discord: GET /guilds/{guild_id}/members. With all_pages it reads every page (after the step's cursor, or from the first item without one) and returns next_cursor to pass as after when the list did not end.

    Action id `rest_list_guild_members` · reads only · connection: bot

    Inputs: `guild_id`, `after`, `limit`, `all_pages`.

    ### Get Guild Templates

    Returns an array of guild template objects. Requires the MANAGE_GUILD permission. Discord: GET /guilds/{guild_id}/templates.

    Action id `rest_list_guild_templates` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Get Guild Voice Regions

    Returns a list of voice region objects for the guild. Unlike the similar /voice route, this returns VIP servers when the guild is VIP-enabled. Discord: GET /guilds/{guild_id}/regions.

    Action id `rest_list_guild_voice_regions` · reads only · connection: bot

    Inputs: `guild_id`.

    ### List Voice Regions

    Returns an array of voice region objects that can be used when setting a voice or stage channel's rtc_region. Discord: GET /voice/regions.

    Action id `rest_list_voice_regions` · reads only · connection: bot

    Inputs: none.

    ### Modify Current User Nick

    Modifies the nickname of the current user in a guild. Returns a 200 with the nickname on success. Fires a Guild Member Update Gateway event. Discord: PATCH /guilds/{guild_id}/members/@me/nick.

    Action id `rest_modify_current_user_nick` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Modify Guild Onboarding

    Modifies the onboarding configuration of the guild. Returns a 200 with the Onboarding object for the guild. Requires the MANAGE_GUILD and MANAGE_ROLES permissions. Discord: PUT /guilds/{guild_id}/onboarding.

    Action id `rest_put_guilds_onboarding` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Search Guild Members

    Returns a list of guild member objects whose username or nickname starts with a provided string. Discord: GET /guilds/{guild_id}/members/search.

    Action id `rest_search_guild_members` · reads only · connection: bot

    Inputs: `guild_id`, `limit`, `query`.

    ### Sync Guild Template

    Syncs the template to the guild's current state. Requires the MANAGE_GUILD permission. Returns the guild template object on success. Discord: PUT /guilds/{guild_id}/templates/{code}.

    Action id `rest_sync_guild_template` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `code`, `audit_reason`.

    ### Modify Guild

    Modify a guild's settings. Requires the MANAGE_GUILD permission. Returns the updated guild object on success. Fires a Guild Update Gateway event. Discord: PATCH /guilds/{guild_id}.

    Action id `rest_update_guild` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Modify Guild Incident Actions

    Modifies the incident actions of the guild. Returns a 200 with the Incidents Data object for the guild. Requires the MANAGE_GUILD permission. Discord: PUT /guilds/{guild_id}/incident-actions.

    Action id `rest_update_guild_incident_actions` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Modify Guild Member

    Modify attributes of a guild member. Returns a 200 OK with the guild member as the body. Fires a Guild Member Update Gateway event. If the channel_id is set to null, this will force the target user to be disconnected from voice. Discord: PATCH /guilds/{guild_id}/members/{user_id}.

    Action id `rest_update_guild_member` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `user_id`, `body`, `audit_reason`.

    ### Modify Guild Template

    Modifies the template's metadata. Requires the MANAGE_GUILD permission. Returns the guild template object on success. Discord: PATCH /guilds/{guild_id}/templates/{code}.

    Action id `rest_update_guild_template` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `code`, `body`, `audit_reason`.

    ### Modify Guild Welcome Screen

    Modify the guild's Welcome Screen. Requires the MANAGE_GUILD permission. Returns the updated Welcome Screen object. May fire a Guild Update Gateway event. Discord: PATCH /guilds/{guild_id}/welcome-screen.

    Action id `rest_update_guild_welcome_screen` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Modify Guild Widget

    Modify a guild widget settings object for the guild. All attributes may be passed in with JSON and modified. Requires the MANAGE_GUILD permission. Returns the updated guild widget settings object. Fires a Guild Update Gateway event. Discord: PATCH /guilds/{guild_id}/widget.

    Action id `rest_update_guild_widget_settings` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Modify Current Member

    Modifies the current member in a guild. Returns a 200 with the updated member object on success. Fires a Guild Member Update Gateway event. Discord: PATCH /guilds/{guild_id}/members/@me.

    Action id `rest_update_my_guild_member` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Modify Current User Voice State

    Updates the current user's voice state. Returns 204 No Content on success. Fires a Voice State Update Gateway event. Discord: PATCH /guilds/{guild_id}/voice-states/@me.

    Action id `rest_update_self_voice_state` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Modify User Voice State

    Updates another user's voice state. Returns 204 No Content on success. Fires a Voice State Update Gateway event. Discord: PATCH /guilds/{guild_id}/voice-states/{user_id}.

    Action id `rest_update_voice_state` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `user_id`, `body`, `audit_reason`.
