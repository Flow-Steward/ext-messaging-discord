- component_id: steps_webhooks
  type: markdown
  title: Webhooks
  body: |
    Create and change webhooks and post messages through them.

    ### Create Webhook

    Creates a new webhook and returns a webhook object on success. Requires the MANAGE_WEBHOOKS permission. Fires a Webhooks Update Gateway event. Discord: POST /channels/{channel_id}/webhooks.

    Action id `rest_create_webhook` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `body`, `audit_reason`.

    ### Delete Original Interaction Response

    Deletes the initial Interaction response. Returns 204 No Content on success. Discord: DELETE /webhooks/{webhook_id}/{webhook_token}/messages/@original.

    Action id `rest_delete_original_webhook_message` · changes data in Discord · connection: webhook or interaction token

    Inputs: `webhook_id`, `thread_id`, `audit_reason`.

    ### Delete Webhook

    Delete a webhook permanently. Requires the MANAGE_WEBHOOKS permission. Returns a 204 No Content response on success. Fires a Webhooks Update Gateway event. Discord: DELETE /webhooks/{webhook_id}.

    Action id `rest_delete_webhook` · changes data in Discord · connection: bot

    Inputs: `webhook_id`, `audit_reason`.

    ### Delete Webhook with Token

    Same as above, except this call does not require authentication. Discord: DELETE /webhooks/{webhook_id}/{webhook_token}.

    Action id `rest_delete_webhook_by_token` · changes data in Discord · connection: webhook or interaction token

    Inputs: `webhook_id`, `audit_reason`.

    ### Delete Webhook Message

    Deletes a message that was created by the webhook. Returns a 204 No Content response on success. Discord: DELETE /webhooks/{webhook_id}/{webhook_token}/messages/{message_id}.

    Action id `rest_delete_webhook_message` · changes data in Discord · connection: webhook or interaction token

    Inputs: `webhook_id`, `message_id`, `thread_id`, `audit_reason`.

    ### Execute GitHub-Compatible Webhook

    Add a new webhook to your GitHub repo (in the repo's settings), and use this endpoint as the "Payload URL." You can choose what events your Discord channel receives by choosing the "Let me select individual events" option and selecting individual events for the new webhook you're configuring. Discord: POST /webhooks/{webhook_id}/{webhook_token}/github.

    Action id `rest_execute_github_compatible_webhook` · changes data in Discord · connection: webhook or interaction token

    Inputs: `webhook_id`, `thread_id`, `wait`, `body`, `audit_reason`.

    ### Execute Slack-Compatible Webhook

    Refer to Slack's documentation for more information. We do not support Slack's channel, icon_emoji, mrkdwn, or mrkdwn_in properties. Discord: POST /webhooks/{webhook_id}/{webhook_token}/slack.

    Action id `rest_execute_slack_compatible_webhook` · changes data in Discord · connection: webhook or interaction token

    Inputs: `webhook_id`, `thread_id`, `wait`, `body`, `media_type`, `files`, `file_artifacts`, `audit_reason`.

    ### Execute Webhook

    Refer to Uploading Files for details on attachments and multipart/form-data requests. Returns a message or 204 No Content depending on the wait query parameter. Discord: POST /webhooks/{webhook_id}/{webhook_token}.

    Action id `rest_execute_webhook` · changes data in Discord · connection: webhook or interaction token

    Inputs: `webhook_id`, `thread_id`, `wait`, `with_components`, `body`, `media_type`, `files`, `file_artifacts`, `audit_reason`.

    ### Get Guild Webhooks

    Returns a list of guild webhook objects. Requires the MANAGE_WEBHOOKS permission. Discord: GET /guilds/{guild_id}/webhooks.

    Action id `rest_get_guild_webhooks` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Get Original Interaction Response

    Returns the initial Interaction response. Functions the same as Get Webhook Message. Discord: GET /webhooks/{webhook_id}/{webhook_token}/messages/@original.

    Action id `rest_get_original_webhook_message` · reads only · connection: webhook or interaction token

    Inputs: `webhook_id`, `thread_id`.

    ### Get Webhook

    Returns the new webhook object for the given id. Discord: GET /webhooks/{webhook_id}.

    Action id `rest_get_webhook` · reads only · connection: bot

    Inputs: `webhook_id`.

    ### Get Webhook with Token

    Same as above, except this call does not require authentication and returns no user in the webhook object. Discord: GET /webhooks/{webhook_id}/{webhook_token}.

    Action id `rest_get_webhook_by_token` · reads only · connection: webhook or interaction token

    Inputs: `webhook_id`.

    ### Get Webhook Message

    Returns a previously-sent webhook message from the same token. Returns a message object on success. Discord: GET /webhooks/{webhook_id}/{webhook_token}/messages/{message_id}.

    Action id `rest_get_webhook_message` · reads only · connection: webhook or interaction token

    Inputs: `webhook_id`, `message_id`, `thread_id`.

    ### Get Channel Webhooks

    Returns a list of channel webhook objects. Requires the MANAGE_WEBHOOKS permission. Discord: GET /channels/{channel_id}/webhooks.

    Action id `rest_list_channel_webhooks` · reads only · connection: bot

    Inputs: `channel_id`.

    ### Edit Original Interaction Response

    Edits the initial Interaction response. Functions the same as Edit Webhook Message. Discord: PATCH /webhooks/{webhook_id}/{webhook_token}/messages/@original.

    Action id `rest_update_original_webhook_message` · changes data in Discord · connection: webhook or interaction token

    Inputs: `webhook_id`, `thread_id`, `with_components`, `body`, `media_type`, `files`, `file_artifacts`, `audit_reason`.

    ### Modify Webhook

    Modify a webhook. Requires the MANAGE_WEBHOOKS permission. Returns the updated webhook object on success. Fires a Webhooks Update Gateway event. Discord: PATCH /webhooks/{webhook_id}.

    Action id `rest_update_webhook` · changes data in Discord · connection: bot

    Inputs: `webhook_id`, `body`, `audit_reason`.

    ### Modify Webhook with Token

    Same as above, except this call does not require authentication, does not accept a channel_id parameter in the body, and does not return a user in the webhook object. Discord: PATCH /webhooks/{webhook_id}/{webhook_token}.

    Action id `rest_update_webhook_by_token` · changes data in Discord · connection: webhook or interaction token

    Inputs: `webhook_id`, `body`, `audit_reason`.

    ### Edit Webhook Message

    Edits a previously-sent webhook message from the same token. Returns a message object on success. Discord: PATCH /webhooks/{webhook_id}/{webhook_token}/messages/{message_id}.

    Action id `rest_update_webhook_message` · changes data in Discord · connection: webhook or interaction token

    Inputs: `webhook_id`, `message_id`, `thread_id`, `with_components`, `body`, `media_type`, `files`, `file_artifacts`, `audit_reason`.
