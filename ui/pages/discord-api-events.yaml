- component_id: steps_events
  type: markdown
  title: Scheduled events
  body: |
    Create and change scheduled events, their exceptions and their subscribers.

    ### Count Guild Scheduled Event Users

    Get the count of users subscribed to a guild scheduled event. Discord: GET /guilds/{guild_id}/scheduled-events/{guild_scheduled_event_id}/users/counts.

    Action id `rest_count_guild_scheduled_event_users` · reads only · connection: bot

    Inputs: `guild_id`, `guild_scheduled_event_id`, `guild_scheduled_event_exception_ids`.

    ### Create Guild Scheduled Event

    Create a guild scheduled event in the guild. Returns a guild scheduled event object on success. Fires a Guild Scheduled Event Create Gateway event. Discord: POST /guilds/{guild_id}/scheduled-events.

    Action id `rest_create_guild_scheduled_event` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Create Guild Scheduled Event Exception

    Create an exception to a recurring guild scheduled event. Discord: POST /guilds/{guild_id}/scheduled-events/{guild_scheduled_event_id}/exceptions.

    Action id `rest_create_guild_scheduled_event_exception` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `guild_scheduled_event_id`, `body`, `audit_reason`.

    ### Delete Guild Scheduled Event

    Delete a guild scheduled event. Returns a 204 on success. Fires a Guild Scheduled Event Delete Gateway event. Discord: DELETE /guilds/{guild_id}/scheduled-events/{guild_scheduled_event_id}.

    Action id `rest_delete_guild_scheduled_event` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `guild_scheduled_event_id`, `audit_reason`.

    ### Delete Guild Scheduled Event Exception

    Delete an exception to a recurring guild scheduled event. Discord: DELETE /guilds/{guild_id}/scheduled-events/{guild_scheduled_event_id}/exceptions/{exception_id}.

    Action id `rest_delete_guild_scheduled_event_exception` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `guild_scheduled_event_id`, `exception_id`, `audit_reason`.

    ### Get Guild Scheduled Event

    Get a guild scheduled event. Returns a guild scheduled event object on success. Discord: GET /guilds/{guild_id}/scheduled-events/{guild_scheduled_event_id}.

    Action id `rest_get_guild_scheduled_event` · reads only · connection: bot

    Inputs: `guild_id`, `guild_scheduled_event_id`, `with_user_count`.

    ### List Guild Scheduled Event Exception Users

    Get a list of users subscribed to a guild scheduled event exception. Discord: GET /guilds/{guild_id}/scheduled-events/{guild_scheduled_event_id}/{guild_scheduled_event_exception_id}/users. With all_pages it reads every page (after the step's cursor, or from the first item without one) and returns next_cursor to pass as after when the list did not end.

    Action id `rest_list_guild_scheduled_event_exception_users` · reads only · connection: bot

    Inputs: `guild_id`, `guild_scheduled_event_id`, `guild_scheduled_event_exception_id`, `after`, `before`, `limit`, `with_member`, `all_pages`.

    ### Get Guild Scheduled Event Users

    Get a list of guild scheduled event users subscribed to a guild scheduled event. Returns a list of guild scheduled event user objects on success. Guild member data, if it exists, is included if the with_member query parameter is set. Discord: GET /guilds/{guild_id}/scheduled-events/{guild_scheduled_event_id}/users. With all_pages it reads every page (after the step's cursor, or from the first item without one) and returns next_cursor to pass as after when the list did not end.

    Action id `rest_list_guild_scheduled_event_users` · reads only · connection: bot

    Inputs: `guild_id`, `guild_scheduled_event_id`, `after`, `before`, `limit`, `with_member`, `all_pages`.

    ### List Scheduled Events for Guild

    Returns a list of guild scheduled event objects for the given guild. Discord: GET /guilds/{guild_id}/scheduled-events.

    Action id `rest_list_guild_scheduled_events` · reads only · connection: bot

    Inputs: `guild_id`, `with_user_count`.

    ### Modify Guild Scheduled Event

    Modify a guild scheduled event. Returns the modified guild scheduled event object on success. Fires a Guild Scheduled Event Update Gateway event. Discord: PATCH /guilds/{guild_id}/scheduled-events/{guild_scheduled_event_id}.

    Action id `rest_update_guild_scheduled_event` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `guild_scheduled_event_id`, `body`, `audit_reason`.

    ### Modify Guild Scheduled Event Exception

    Modify an exception to a recurring guild scheduled event. Discord: PATCH /guilds/{guild_id}/scheduled-events/{guild_scheduled_event_id}/exceptions/{exception_id}.

    Action id `rest_update_guild_scheduled_event_exception` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `guild_scheduled_event_id`, `exception_id`, `body`, `audit_reason`.
