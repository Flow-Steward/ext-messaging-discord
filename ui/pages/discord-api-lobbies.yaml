  type: markdown
  title: Lobbies and Social SDK
  body: |
    Lobbies, provisional accounts and application identities of the Discord Social SDK.

    ### Add a Member to a Lobby

    Adds the provided user to the specified lobby. If called when the user is already a member of the lobby will update fields such as metadata on that user instead. Discord: PUT /lobbies/{lobby_id}/members/{user_id}.

    Action id `rest_add_lobby_member` · changes data in Discord · connection: bot

    Inputs: `lobby_id`, `user_id`, `body`, `audit_reason`.

    ### Social SDK Token (Bot)

    Exchanges an external account's credentials for a Discord provisional account token, authorized with the bot token (Discord Social SDK). Discord: POST /partner-sdk/token/bot.

    Action id `rest_bot_partner_sdk_token` · changes data in Discord · connection: bot

    Inputs: `body`, `audit_reason`.

    ### Unmerge Provisional Account (Bot)

    Separates a provisional account from the Discord account it was merged into, authorized with the bot token (Discord Social SDK). Discord: POST /partner-sdk/provisional-accounts/unmerge/bot.

    Action id `rest_bot_partner_sdk_unmerge_provisional_account` · changes data in Discord · connection: bot

    Inputs: `body`, `audit_reason`.

    ### Bulk Update Lobby Members

    Adds, updates, or removes up to 25 members from the specified lobby in a single request. Members with remove_member: false (the default) are upserted — added if not present, or updated with the provided metadata and flags if already a member. Members with remove_member: true are removed. Discord: POST /lobbies/{lobby_id}/members/bulk.

    Action id `rest_bulk_update_lobby_members` · changes data in Discord · connection: bot

    Inputs: `lobby_id`, `body`, `audit_reason`.

    ### Create Lobby Channel Invite for Self

    Creates a single-use guild invite to the lobby's linked channel, targeted at the calling user. The lobby must have a linked channel and the caller must be a member of the lobby. The invite expires after one hour. Discord: POST /lobbies/{lobby_id}/members/@me/invites.

    Action id `rest_create_linked_lobby_guild_invite_for_self` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `lobby_id`, `audit_reason`.

    ### Create Lobby Channel Invite for User

    Creates a single-use guild invite to the lobby's linked channel on behalf of an application, targeted at the specified user. The lobby must have a linked channel. The invite expires after one hour. Discord: POST /lobbies/{lobby_id}/members/{user_id}/invites.

    Action id `rest_create_linked_lobby_guild_invite_for_user` · changes data in Discord · connection: bot

    Inputs: `lobby_id`, `user_id`, `audit_reason`.

    ### Create Lobby

    Creates a new lobby, adding any of the specified members to it, if provided. Discord: POST /lobbies.

    Action id `rest_create_lobby` · changes data in Discord · connection: bot

    Inputs: `body`, `audit_reason`.

    ### Send Lobby Message

    Sends a message to the specified lobby. The calling user must be a member of the lobby. Discord: POST /lobbies/{lobby_id}/messages.

    Action id `rest_create_lobby_message` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `lobby_id`, `body`, `media_type`, `files`, `file_artifacts`, `audit_reason`.

    ### Create or Join Lobby

    Creates a new lobby for the application identified by a secret, or joins the calling user to the existing lobby with that secret if one already exists. Updates lobby metadata and the calling member's metadata on join. Discord: PUT /lobbies.

    Action id `rest_create_or_join_lobby` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `body`, `audit_reason`.

    ### Delete Application Identity

    Deletes one Application Identity and its associated profile data for the specified user and application. Use this endpoint when a stale provider-issued user ID prevents you from writing profile data for the user's current identity. Discord: POST /users/{user_id}/application-identities/{application_id}/{provider_type}/{provider_issued_user_id}/delete.

    Action id `rest_delete_application_identity` · changes data in Discord · connection: bot

    Inputs: `user_id`, `application_id`, `provider_type`, `provider_issued_user_id`, `body`, `audit_reason`.

    ### Delete Lobby

    Deletes the specified lobby if it exists. Discord: DELETE /lobbies/{lobby_id}.

    Action id `rest_delete_lobby` · changes data in Discord · connection: bot

    Inputs: `lobby_id`, `audit_reason`.

    ### Remove a Member from a Lobby

    Removes the provided user from the specified lobby. It is safe to call this even if the user is no longer a member of the lobby, but will fail if the lobby does not exist. Discord: DELETE /lobbies/{lobby_id}/members/{user_id}.

    Action id `rest_delete_lobby_member` · changes data in Discord · connection: bot

    Inputs: `lobby_id`, `user_id`, `audit_reason`.

    ### Modify Lobby

    Modifies the specified lobby with new values, if provided. Discord: PATCH /lobbies/{lobby_id}.

    Action id `rest_edit_lobby` · changes data in Discord · connection: bot

    Inputs: `lobby_id`, `body`, `audit_reason`.

    ### Link Channel to Lobby

    Links an existing text channel to a lobby. See Linked Channels for more information. Discord: PATCH /lobbies/{lobby_id}/channel-linking.

    Action id `rest_edit_lobby_channel_link` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `lobby_id`, `body`, `audit_reason`.

    ### Get Application Identity Profile

    Returns the Application Identity Profile object stored on the matching Application Identity for the specified user and application. Discord: GET /applications/{application_id}/users/{user_id}/identities/{provider_issued_user_id}/profile.

    Action id `rest_get_application_identity_profile` · reads only · connection: bot

    Inputs: `application_id`, `user_id`, `provider_issued_user_id`.

    ### Get Lobby

    Returns a lobby object for the specified lobby id, if it exists. Discord: GET /lobbies/{lobby_id}.

    Action id `rest_get_lobby` · reads only · connection: bot

    Inputs: `lobby_id`.

    ### Get Lobby Messages

    Returns the most recent messages in the specified lobby. The calling user must be a member of the lobby. Discord: GET /lobbies/{lobby_id}/messages.

    Action id `rest_get_lobby_messages` · reads only · connection: bot, OAuth2 token

    Inputs: `lobby_id`, `limit`.

    ### Leave Lobby

    Removes the current user from the specified lobby. It is safe to call this even if the user is no longer a member of the lobby, but will fail if the lobby does not exist. Discord: DELETE /lobbies/{lobby_id}/members/@me.

    Action id `rest_leave_lobby` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `lobby_id`, `audit_reason`.

    ### Get Application Identities by External ID

    Returns the application identities for the user/application record currently associated with the specified external ID (combination of provider_type, provider_issued_user_id, and optional provider_id). Use this endpoint when you need to resolve the Discord user_id for an Application Identity but only know the external ID fields. Discord: GET /applications/{application_id}/application-identities/{provider_type}/{provider_issued_user_id}.

    Action id `rest_list_application_identities_by_external_id` · reads only · connection: bot

    Inputs: `application_id`, `provider_type`, `provider_issued_user_id`, `provider_id`.

    ### Get Application Identities by User ID

    Returns the application identities for the specified user and application. Use this endpoint to discover the exact external ID values (provider_type, provider_issued_user_id, and optional provider_id) for a user's application identities. Discord: GET /users/{user_id}/application-identities/{application_id}.

    Action id `rest_list_application_identities_by_user_id` · reads only · connection: bot

    Inputs: `user_id`, `application_id`.

    ### Social SDK Token

    Exchanges an external account's credentials for a Discord provisional account token (Discord Social SDK). Discord: POST /partner-sdk/token.

    Action id `rest_partner_sdk_token` · changes data in Discord · connection: bot

    Inputs: `body`, `audit_reason`.

    ### Unmerge Provisional Account

    Separates a provisional account from the Discord account it was merged into (Discord Social SDK). Discord: POST /partner-sdk/provisional-accounts/unmerge.

    Action id `rest_partner_sdk_unmerge_provisional_account` · changes data in Discord · connection: bot

    Inputs: `body`, `audit_reason`.

    ### Update Application Identity Profile

    Updates the profile data on the user's matching Application Identity record. Returns an Application Identity Profile object. Discord: PATCH /applications/{application_id}/users/{user_id}/identities/{provider_issued_user_id}/profile.

    Action id `rest_update_application_identity_profile` · changes data in Discord · connection: bot

    Inputs: `application_id`, `user_id`, `provider_issued_user_id`, `body`, `audit_reason`.
