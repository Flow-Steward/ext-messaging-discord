  type: markdown
  title: Users and OAuth2
  body: |
    The current user, their servers, connections and DMs, and OAuth2 information.

    ### Create DM

    Create a new DM channel with a user. Returns a DM channel object (if one already exists, it will be returned instead). Discord: POST /users/@me/channels.

    Action id `rest_create_dm` · changes data in Discord · connection: bot

    Inputs: `body`, `audit_reason`.

    ### Get Current User Guild Member

    Returns a guild member object for the current user. Requires the guilds.members.read OAuth2 scope. Discord: GET /users/@me/guilds/{guild_id}/member.

    Action id `rest_get_my_guild_member` · reads only · connection: OAuth2 token

    Inputs: `guild_id`.

    ### Get Current Authorization Information

    Returns info about the current authorization. Requires authentication with a bearer token. Discord: GET /oauth2/@me.

    Action id `rest_get_my_oauth2_authorization` · reads only · connection: bot, OAuth2 token

    Inputs: none.

    ### Get Current User

    Returns the user object of the requester's account. For OAuth2, this requires the identify scope, which will return the object _without_ an email, and optionally the email scope, which returns the object _with_ an email if the user has one. Discord: GET /users/@me.

    Action id `rest_get_my_user` · reads only · connection: bot, OAuth2 token

    Inputs: none.

    ### Get OpenID Connect User Info

    Returns the OpenID Connect user information of the authorized user. Discord: GET /oauth2/userinfo.

    Action id `rest_get_openid_connect_userinfo` · reads only · connection: bot, OAuth2 token

    Inputs: none.

    ### Get OAuth2 Public Keys

    Returns Discord's OAuth2 public signing keys (a JSON Web Key Set). Discord: GET /oauth2/keys.

    Action id `rest_get_public_keys` · reads only · connection: bot

    Inputs: none.

    ### Get User

    Returns a user object for a given user ID. Discord: GET /users/{user_id}.

    Action id `rest_get_user` · reads only · connection: bot

    Inputs: `user_id`.

    ### Leave Guild

    Leave a guild. Returns a 204 empty response on success. Fires a Guild Delete Gateway event and a Guild Member Remove Gateway event. Discord: DELETE /users/@me/guilds/{guild_id}.

    Action id `rest_leave_guild` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `audit_reason`.

    ### Get Current User Connections

    Returns a list of connection objects. Requires the connections OAuth2 scope. Discord: GET /users/@me/connections.

    Action id `rest_list_my_connections` · reads only · connection: bot, OAuth2 token

    Inputs: none.

    ### Get Current User Guilds

    Returns a list of partial guild objects the current user is a member of. For OAuth2, requires the guilds scope. Discord: GET /users/@me/guilds. With all_pages it reads every page (after the step's cursor, or from the first item without one) and returns next_cursor to pass as after when the list did not end.

    Action id `rest_list_my_guilds` · reads only · connection: bot, OAuth2 token

    Inputs: `after`, `before`, `limit`, `shard`, `with_counts`, `all_pages`.

    ### Modify Current User

    Modify the requester's user account settings. Returns a user object on success. Fires a User Update Gateway event. Discord: PATCH /users/@me.

    Action id `rest_update_my_user` · changes data in Discord · connection: bot

    Inputs: `body`, `audit_reason`.
