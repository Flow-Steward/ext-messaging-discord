- component_id: steps_roles
  type: markdown
  title: Roles
  body: |
    Create, change, order and delete roles, and give them to members.

    ### Add Guild Member Role

    Adds a role to a guild member. Requires the MANAGE_ROLES permission. Returns a 204 empty response on success. Fires a Guild Member Update Gateway event. Discord: PUT /guilds/{guild_id}/members/{user_id}/roles/{role_id}.

    Action id `rest_add_guild_member_role` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `user_id`, `role_id`, `audit_reason`.

    ### Modify Guild Role Positions

    Modify the positions of a set of role objects for the guild. Requires the MANAGE_ROLES permission. Returns a list of all of the guild's role objects on success. Fires multiple Guild Role Update Gateway events. Discord: PATCH /guilds/{guild_id}/roles.

    Action id `rest_bulk_update_guild_roles` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Create Guild Role

    Create a new role for the guild. Requires the MANAGE_ROLES permission. Returns the new role object on success. Fires a Guild Role Create Gateway event. All JSON params are optional. Discord: POST /guilds/{guild_id}/roles.

    Action id `rest_create_guild_role` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Remove Guild Member Role

    Removes a role from a guild member. Requires the MANAGE_ROLES permission. Returns a 204 empty response on success. Fires a Guild Member Update Gateway event. Discord: DELETE /guilds/{guild_id}/members/{user_id}/roles/{role_id}.

    Action id `rest_delete_guild_member_role` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `user_id`, `role_id`, `audit_reason`.

    ### Delete Guild Role

    Delete a guild role. Requires the MANAGE_ROLES permission. Returns a 204 empty response on success. Fires a Guild Role Delete Gateway event. Discord: DELETE /guilds/{guild_id}/roles/{role_id}.

    Action id `rest_delete_guild_role` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `role_id`, `audit_reason`.

    ### Get Guild Role

    Returns a role object for the specified role. Discord: GET /guilds/{guild_id}/roles/{role_id}.

    Action id `rest_get_guild_role` · reads only · connection: bot

    Inputs: `guild_id`, `role_id`.

    ### Get Guild Role Member Counts

    Returns a map of role IDs to the number of members with the role. Does not include the @everyone role. Discord: GET /guilds/{guild_id}/roles/member-counts.

    Action id `rest_guild_role_member_counts` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Get Guild Roles

    Returns a list of role objects for the guild. Discord: GET /guilds/{guild_id}/roles.

    Action id `rest_list_guild_roles` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Modify Guild Role

    Modify a guild role. Requires the MANAGE_ROLES permission. Returns the updated role on success. Fires a Guild Role Update Gateway event. Discord: PATCH /guilds/{guild_id}/roles/{role_id}.

    Action id `rest_update_guild_role` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `role_id`, `body`, `audit_reason`.
