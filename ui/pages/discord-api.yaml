    - **Delete Guild Soundboard Sound** — Delete the given soundboard sound. (`rest_delete_guild_soundboard_sound`)
    - **Delete Guild Sticker** — Delete the given sticker. (`rest_delete_guild_sticker`)
    - **Get Application Emoji** — Returns an emoji object for the given application and emoji IDs. (`rest_get_application_emoji`)
    - **Get Guild Emoji** — Returns an emoji object for the given guild and emoji IDs. (`rest_get_guild_emoji`)
    - **Get Guild Soundboard Sound** — Returns a soundboard sound object for the given sound id. (`rest_get_guild_soundboard_sound`)
