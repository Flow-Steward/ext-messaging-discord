  body: |
    Create, change, order and delete roles, and give them to members.

    - **Add Guild Member Role** — Adds a role to a guild member. (`rest_add_guild_member_role`)
    - **Modify Guild Role Positions** — Modify the positions of a set of role objects for the guild. (`rest_bulk_update_guild_roles`)
    - **Create Guild Role** — Create a new role for the guild. (`rest_create_guild_role`)
    - **Remove Guild Member Role** — Removes a role from a guild member. (`rest_delete_guild_member_role`)
    - **Delete Guild Role** — Delete a guild role. (`rest_delete_guild_role`)
    - **Get Guild Role** — Returns a role object for the specified role. (`rest_get_guild_role`)
    - **Get Guild Role Member Counts** — Returns a map of role IDs to the number of members with the role. (`rest_guild_role_member_counts`)
    - **Get Guild Roles** — Returns a list of role objects for the guild. (`rest_list_guild_roles`)
    - **Modify Guild Role** — Modify a guild role. (`rest_update_guild_role`)
