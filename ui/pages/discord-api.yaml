page_id: discord-api
title: API
description: Every Discord step by group, with what it does.
components:
- component_id: api_overview
  type: markdown
  title: How the steps work
  body: |
    The steps call the Discord REST API v10. Every operation of the pinned API description has its own step: **258 steps**, plus the everyday steps below.

    - **Connections.** Most steps act as your bot (**Discord bot** connection). Steps that act for a person need a **Discord OAuth2 token**; steps whose address holds a webhook or interaction token take it from a **Discord webhook or interaction token** connection. Each step names the connections it accepts.
    - **Permissions.** Discord checks the bot's permissions in the server and channel (for example Manage Messages or Manage Roles); a missing one is refused and nothing changes.
    - **Request bodies** go in `body` as `{"data": {...}}` with the fields Discord documents for the step. Files go in `file_artifacts` (workflow files) or `files` (small base64 files).
    - **Lists.** With `all_pages` a list step reads page after page; when it stops early, `complete` is false and `next_cursor` says where to continue.
    - **Rate limits.** Every step returns `rate_limit` from Discord's headers; an HTTP 429 answer says how long to wait.
    - **Changes are sent once.** A step that changes data is never retried automatically; when its outcome is unclear it says so. Test runs never send changes.

    The steps by group:

    - **Messages** (23 steps): Send, read, edit, pin and delete messages, reactions and polls.
    - **Channels and threads** (39 steps): Read, create and change channels, threads, permissions, invites and stage instances.
    - **Servers and members** (42 steps): Read and change servers, their members, onboarding, widgets, templates and voice states.
    - **Roles** (9 steps): Create, change, order and delete roles, and give them to members.
    - **Moderation and audit log** (17 steps): Bans, pruning, join requests, auto moderation rules and the audit log.
    - **Webhooks** (18 steps): Create and change webhooks and post messages through them.
    - **Emojis, stickers and sounds** (25 steps): Server and application emojis, stickers and soundboard sounds.
    - **Scheduled events** (11 steps): Create and change scheduled events, their exceptions and their subscribers.
    - **Applications, commands and interactions** (31 steps): The application itself, its slash commands and permissions, role connections, interaction responses and the Gateway address.
    - **Lobbies and Social SDK** (23 steps): Lobbies, provisional accounts and application identities of the Discord Social SDK.
    - **Monetization** (9 steps): SKUs, entitlements and subscriptions.
    - **Users and OAuth2** (11 steps): The current user, their servers, connections and DMs, and OAuth2 information.
- component_id: steps_everyday
  type: markdown
  title: Everyday (6)
  body: |
    - **Test connection** — Checks that Discord accepts the bot token by reading the bot's own user, and returns its ID and name. (`test_connection`)
    - **Send message** — Posts a text message to a channel as the bot. (`send_message`)
    - **Get channel** — Reads a channel by its ID (name, type, topic, parent, permissions). (`get_channel`)
    - **List channel messages** — Reads the messages of a channel, newest first; with all_pages the whole history, page after page. (`list_messages`)
    - **Get server** — Reads a server by its ID, with approximate member counts when asked. (`get_guild`)
    - **List server channels** — Reads every channel of a server (not threads). (`list_guild_channels`)
  collapsible: true
- component_id: steps_messages
  type: markdown
  title: Messages (23)
  body: |
    Send, read, edit, pin and delete messages, reactions and polls.

    - **Create Reaction** — Create a reaction for the message. (`rest_add_my_message_reaction`)
    - **Bulk Delete Messages** — Delete multiple messages in a single request. (`rest_bulk_delete_messages`)
    - **Create Message** — Post a message to a guild text or DM channel. (`rest_create_message`)
    - **Pin Message** — Pin a message in a channel. (`rest_create_pin`)
    - **Start Thread from Message** — Creates a new thread from an existing message. (`rest_create_thread_from_message`)
    - **Crosspost Message** — Crosspost a message in an Announcement Channel to following channels. (`rest_crosspost_message`)
    - **Delete All Reactions** — Deletes all reactions on a message. (`rest_delete_all_message_reactions`)
    - **Delete All Reactions for Emoji** — Deletes all the reactions for a given emoji on a message. (`rest_delete_all_message_reactions_by_emoji`)
    - **Delete Message** — Delete a message. (`rest_delete_message`)
    - **Delete Own Reaction** — Delete a reaction the current user has made for the message. (`rest_delete_my_message_reaction`)
    - **Unpin Message** — Unpin a message in a channel. (`rest_delete_pin`)
    - **Delete User Reaction** — Deletes another user's reaction. (`rest_delete_user_message_reaction`)
    - **Pin Message (deprecated)** — This endpoint is deprecated. (`rest_deprecated_create_pin`)
    - **Unpin Message (deprecated)** — This endpoint is deprecated. (`rest_deprecated_delete_pin`)
    - **Get Pinned Messages (deprecated)** — Gets the first 50 pinned messages in a channel, returning an array of message objects on success. (`rest_deprecated_list_pins`)
    - **Get Answer Voters** — Get a list of users that voted for this specific answer. (`rest_get_answer_voters`)
    - **Get Channel Message** — Retrieves a specific message in the channel. (`rest_get_message`)
    - **Search Guild Messages** — Returns a list of messages without the reactions key that match a search query in the guild. (`rest_guild_search`)
    - **Get Reactions** — Get a list of users that reacted with this emoji. (`rest_list_message_reactions_by_emoji`)
    - **Get Channel Messages** — Retrieves the messages in a channel. (`rest_list_messages`)
    - **Get Channel Pins** — Retrieves the list of pins in a channel. (`rest_list_pins`)
    - **End Poll** — Immediately ends the poll. (`rest_poll_expire`)
    - **Edit Message** — Edit a previously sent message. (`rest_update_message`)
  collapsible: true
- component_id: steps_channels
  type: markdown
  title: Channels and threads (39)
  body: |
    Read, create and change channels, threads, permissions, invites and stage instances.

    - **Group DM Add Recipient** — Adds a recipient to a Group DM using their access token. (`rest_add_group_dm_user`)
    - **Add Target User** — Adds a target user to an existing invite. (`rest_add_invite_target_user`)
    - **Add Thread Member** — Adds another member to a thread. (`rest_add_thread_member`)
    - **Bulk-Add Target Users** — Adds multiple target users to an existing invite. (`rest_bulk_add_invite_target_users`)
    - **Bulk-Delete Target Users** — Removes multiple target users from an existing invite. (`rest_bulk_remove_invite_target_users`)
    - **Create Channel Invite** — Create a new invite object for the channel. (`rest_create_channel_invite`)
    - **Create Stage Instance** — Creates a new Stage instance associated to a Stage channel. (`rest_create_stage_instance`)
    - **Start Thread without Message** — Creates a new thread that is not connected to an existing message. (`rest_create_thread`)
    - **Delete/Close Channel** — Delete a channel, or close a private message. (`rest_delete_channel`)
    - **Delete Channel Permission** — Delete a channel permission overwrite for a user or role in a channel. (`rest_delete_channel_permission_overwrite`)
    - **Group DM Remove Recipient** — Removes a recipient from a Group DM. (`rest_delete_group_dm_user`)
    - **Delete Stage Instance** — Deletes the Stage instance. (`rest_delete_stage_instance`)
    - **Remove Thread Member** — Removes another member from a thread. (`rest_delete_thread_member`)
    - **Follow Announcement Channel** — Follow an Announcement Channel to send messages to a target channel. (`rest_follow_channel`)
    - **List Active Guild Threads** — Returns all active threads in the guild, including public and private threads. (`rest_get_active_guild_threads`)
    - **Get Channel** — Get a channel by ID. (`rest_get_channel`)
    - **Get Channel Member Permissions** — Returns the member's computed permissions in the channel, including their roles and member-specific overwrites. (`rest_get_channel_member_permissions`)
    - **Get Channel Role Permissions** — Returns the permissions granted by the specified role together with @everyone, applying their channel overwrites. (`rest_get_channel_role_permissions`)
    - **Get Target Users** — Gets the users allowed to see and accept this invite. (`rest_get_invite_target_users`)
    - **Get Target Users Job Status** — Processing target users from a CSV when creating or updating an invite is done asynchronously. (`rest_get_invite_target_users_job_status`)
    - **Get Stage Instance** — Gets the stage instance associated with the Stage channel, if it exists. (`rest_get_stage_instance`)
    - **Get Thread Member** — Returns a thread member object for the specified user if they are a member of the thread, returns a 404 response otherwise. (`rest_get_thread_member`)
    - **Get Invite** — Returns an invite object for the given code. (`rest_invite_resolve`)
    - **Delete Invite** — Delete an invite. (`rest_invite_revoke`)
    - **Join Thread** — Adds the current user to a thread. (`rest_join_thread`)
    - **Leave Thread** — Removes the current user from a thread. (`rest_leave_thread`)
    - **Get Channel Invites** — Returns a list of invite objects (with invite metadata) for the channel. (`rest_list_channel_invites`)
    - **List Joined Private Archived Threads** — Returns archived threads in the channel that are of type PRIVATE_THREAD, and the user has joined. (`rest_list_my_private_archived_threads`)
    - **List Private Archived Threads** — Returns archived threads in the channel that are of type PRIVATE_THREAD. (`rest_list_private_archived_threads`)
    - **List Public Archived Threads** — Returns archived threads in the channel that are public. (`rest_list_public_archived_threads`)
    - **List Thread Members** — Returns array of thread members objects that are members of the thread. (`rest_list_thread_members`)
    - **Remove Target User** — Removes a target user from an existing invite. (`rest_remove_invite_target_user`)
    - **Edit Channel Permissions** — Edit the channel permission overwrites for a user or role in a channel. (`rest_set_channel_permission_overwrite`)
    - **Search Threads** — Searches the threads of a channel. (`rest_thread_search`)
    - **Trigger Typing Indicator** — Post a typing indicator for the specified channel, which expires after 10 seconds. (`rest_trigger_typing_indicator`)
    - **Modify Channel** — Update a channel's settings. (`rest_update_channel`)
    - **Update Target Users** — Updates the users allowed to see and accept this invite. (`rest_update_invite_target_users`)
    - **Modify Stage Instance** — Updates fields of an existing Stage instance. (`rest_update_stage_instance`)
    - **Set Voice Channel Status** — Set a voice channel's status. (`rest_update_voice_channel_status`)
  collapsible: true
- component_id: steps_guilds
  type: markdown
  title: Servers and members (42)
  body: |
    Read and change servers, their members, onboarding, widgets, templates and voice states.

    - **Add Guild Member** — Adds a user to the guild, provided you have a valid oauth2 access token for the user with the guilds.join scope. (`rest_add_guild_member`)
    - **Modify Guild Channel Positions** — Modify the positions of a set of channel objects for the guild. (`rest_bulk_update_guild_channels`)
    - **Create Guild Channel** — Create a new channel object for the guild. (`rest_create_guild_channel`)
    - **Create Guild Template** — Creates a template for the guild. (`rest_create_guild_template`)
    - **Delete Guild Integration** — Delete the attached integration object for the guild. (`rest_delete_guild_integration`)
    - **Remove Guild Member** — Remove a member from a guild. (`rest_delete_guild_member`)
    - **Delete Guild Template** — Deletes the template. (`rest_delete_guild_template`)
    - **Get Guild** — Returns the guild object for the given id. (`rest_get_guild`)
    - **Get Guild Member** — Returns a guild member object for the specified user. (`rest_get_guild_member`)
    - **Get Guild Member Permissions** — Returns the member's computed guild permissions, combining their roles with @everyone. (`rest_get_guild_member_permissions`)
    - **Get Guild New Member Welcome** — Returns the server's welcome settings for new members. (`rest_get_guild_new_member_welcome`)
    - **Get Guild Preview** — Returns the guild preview object for the given id. (`rest_get_guild_preview`)
    - **Get Guild Role Permissions** — Returns the combined guild permissions of the specified role and @everyone. (`rest_get_guild_role_permissions`)
    - **Get Guild Template** — Returns a guild template object for the given code. (`rest_get_guild_template`)
    - **Get Guild Vanity URL** — Returns a partial invite object for guilds with that feature enabled. (`rest_get_guild_vanity_url`)
    - **Get Guild Welcome Screen** — Returns the Welcome Screen object for the guild. (`rest_get_guild_welcome_screen`)
    - **Get Guild Widget** — Returns the widget for the guild. (`rest_get_guild_widget`)
    - **Get Guild Widget Image** — Returns a PNG image widget for the guild. (`rest_get_guild_widget_png`)
    - **Get Guild Widget Settings** — Returns a guild widget settings object. (`rest_get_guild_widget_settings`)
    - **Get Guild Onboarding** — Returns the Onboarding object for the guild. (`rest_get_guilds_onboarding`)
    - **Get Current User Voice State** — Returns the current user's voice state in the guild. (`rest_get_self_voice_state`)
    - **Get User Voice State** — Returns the specified user's voice state in the guild. (`rest_get_voice_state`)
    - **Get Guild Channels** — Returns a list of guild channel objects. (`rest_list_guild_channels`)
    - **Get Guild Integrations** — Returns a list of integration objects for the guild. (`rest_list_guild_integrations`)
    - **Get Guild Invites** — Returns a list of invite objects. (`rest_list_guild_invites`)
    - **List Guild Members** — Returns a list of guild member objects that are members of the guild. (`rest_list_guild_members`)
    - **Get Guild Templates** — Returns an array of guild template objects. (`rest_list_guild_templates`)
    - **Get Guild Voice Regions** — Returns a list of voice region objects for the guild. (`rest_list_guild_voice_regions`)
    - **List Voice Regions** — Returns an array of voice region objects that can be used when setting a voice or stage channel's rtc_region. (`rest_list_voice_regions`)
    - **Modify Current User Nick** — Modifies the nickname of the current user in a guild. (`rest_modify_current_user_nick`)
    - **Modify Guild Onboarding** — Modifies the onboarding configuration of the guild. (`rest_put_guilds_onboarding`)
    - **Search Guild Members** — Returns a list of guild member objects whose username or nickname starts with a provided string. (`rest_search_guild_members`)
    - **Sync Guild Template** — Syncs the template to the guild's current state. (`rest_sync_guild_template`)
    - **Modify Guild** — Modify a guild's settings. (`rest_update_guild`)
    - **Modify Guild Incident Actions** — Modifies the incident actions of the guild. (`rest_update_guild_incident_actions`)
    - **Modify Guild Member** — Modify attributes of a guild member. (`rest_update_guild_member`)
    - **Modify Guild Template** — Modifies the template's metadata. (`rest_update_guild_template`)
    - **Modify Guild Welcome Screen** — Modify the guild's Welcome Screen. (`rest_update_guild_welcome_screen`)
    - **Modify Guild Widget** — Modify a guild widget settings object for the guild. (`rest_update_guild_widget_settings`)
    - **Modify Current Member** — Modifies the current member in a guild. (`rest_update_my_guild_member`)
    - **Modify Current User Voice State** — Updates the current user's voice state. (`rest_update_self_voice_state`)
    - **Modify User Voice State** — Updates another user's voice state. (`rest_update_voice_state`)
