- component_id: steps_moderation
  type: markdown
  title: Moderation and audit log (17)
  body: |
    Bans, pruning, join requests, auto moderation rules and the audit log.

    - **Action Guild Join Request** — Approve or reject guild join request. (`rest_action_guild_join_request`)
    - **Create Guild Ban** — Create a guild ban, and optionally delete previous messages sent by the banned user. (`rest_ban_user_from_guild`)
    - **Bulk Guild Ban** — Ban up to 200 users from a guild, and optionally delete previous messages sent by the banned users. (`rest_bulk_ban_users_from_guild`)
    - **Create Auto Moderation Rule** — Create a new rule. (`rest_create_auto_moderation_rule`)
    - **Delete Auto Moderation Rule** — Delete a rule. (`rest_delete_auto_moderation_rule`)
    - **Get Auto Moderation Rule** — Get a single rule. (`rest_get_auto_moderation_rule`)
    - **Get Guild Ban** — Returns a ban object for the given user or a 404 not found if the ban cannot be found. (`rest_get_guild_ban`)
    - **Get Guild Join Requests** — List join requests for guild, optionally filtered by application status. (`rest_get_guild_join_requests`)
    - **List Auto Moderation Rules for Guild** — Get a list of all rules currently configured for the guild. (`rest_list_auto_moderation_rules`)
    - **Get Guild Audit Log** — Returns an audit log object for the guild. (`rest_list_guild_audit_log_entries`)
    - **Get Guild Bans** — Returns a list of ban objects for the users banned from this guild. (`rest_list_guild_bans`)
    - **Get Guild Prune Count** — Returns an object with one pruned key indicating the number of members that would be removed in a prune operation. (`rest_preview_prune_guild`)
    - **Begin Guild Prune** — Begin a prune operation. (`rest_prune_guild`)
    - **Remove Guild Ban** — Remove the ban for a user. (`rest_unban_user_from_guild`)
    - **Modify Auto Moderation Rule** — Modify an existing rule. (`rest_update_auto_moderation_rule`)
    - **Update Lobby Message Moderation Metadata** — Sets the moderation metadata for a lobby message. (`rest_update_lobby_message_external_moderation_metadata`)
    - **Update User Message Moderation Metadata** — Update the external moderation metadata for a user message (DM). (`rest_update_user_message_external_moderation_metadata`)
  collapsible: true
- component_id: steps_webhooks
  type: markdown
  title: Webhooks (18)
  body: |
    Create and change webhooks and post messages through them.

    - **Create Webhook** — Creates a new webhook and returns a webhook object on success. (`rest_create_webhook`)
    - **Delete Original Interaction Response** — Deletes the initial Interaction response. (`rest_delete_original_webhook_message`)
    - **Delete Webhook** — Delete a webhook permanently. (`rest_delete_webhook`)
    - **Delete Webhook with Token** — Same as above, except this call does not require authentication. (`rest_delete_webhook_by_token`)
    - **Delete Webhook Message** — Deletes a message that was created by the webhook. (`rest_delete_webhook_message`)
    - **Execute GitHub-Compatible Webhook** — Add a new webhook to your GitHub repo (in the repo's settings), and use this endpoint as the "Payload URL." You can choose what events your Discord channel receives by choosing the "Let me select individual events" option and selecting individual events for the new webhook you're configuring. (`rest_execute_github_compatible_webhook`)
    - **Execute Slack-Compatible Webhook** — Refer to Slack's documentation for more information. (`rest_execute_slack_compatible_webhook`)
    - **Execute Webhook** — Refer to Uploading Files for details on attachments and multipart/form-data requests. (`rest_execute_webhook`)
    - **Get Guild Webhooks** — Returns a list of guild webhook objects. (`rest_get_guild_webhooks`)
    - **Get Original Interaction Response** — Returns the initial Interaction response. (`rest_get_original_webhook_message`)
    - **Get Webhook** — Returns the new webhook object for the given id. (`rest_get_webhook`)
    - **Get Webhook with Token** — Same as above, except this call does not require authentication and returns no user in the webhook object. (`rest_get_webhook_by_token`)
    - **Get Webhook Message** — Returns a previously-sent webhook message from the same token. (`rest_get_webhook_message`)
    - **Get Channel Webhooks** — Returns a list of channel webhook objects. (`rest_list_channel_webhooks`)
    - **Edit Original Interaction Response** — Edits the initial Interaction response. (`rest_update_original_webhook_message`)
    - **Modify Webhook** — Modify a webhook. (`rest_update_webhook`)
    - **Modify Webhook with Token** — Same as above, except this call does not require authentication, does not accept a channel_id parameter in the body, and does not return a user in the webhook object. (`rest_update_webhook_by_token`)
    - **Edit Webhook Message** — Edits a previously-sent webhook message from the same token. (`rest_update_webhook_message`)
  collapsible: true
