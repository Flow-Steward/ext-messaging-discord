    - **Send Soundboard Sound** — Send a soundboard sound to a voice channel the user is connected to. (`rest_send_soundboard_sound`)
    - **Modify Application Emoji** — Modify the given emoji. (`rest_update_application_emoji`)
    - **Modify Guild Emoji** — Modify the given emoji. (`rest_update_guild_emoji`)
    - **Modify Guild Soundboard Sound** — Modify the given soundboard sound. (`rest_update_guild_soundboard_sound`)
    - **Modify Guild Sticker** — Modify the given sticker. (`rest_update_guild_sticker`)
