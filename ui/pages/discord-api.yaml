    - **List Guild Soundboard Sounds** — Returns a list of the guild's soundboard sounds. (`rest_list_guild_soundboard_sounds`)
    - **List Guild Stickers** — Returns an array of sticker objects for the given guild. (`rest_list_guild_stickers`)
