- component_id: steps_applications
  type: markdown
  title: Applications, commands and interactions (31)
  body: |
    The application itself, its slash commands and permissions, role connections, interaction responses and the Gateway address.

    - **Get Application Activity Instance** — Returns a serialized activity instance, if it exists. (`rest_applications_get_activity_instance`)
    - **Batch Edit Application Command Permissions** — This endpoint has been disabled with updates to command permissions (Permissions v2). (`rest_batch_edit_application_command_permissions`)
    - **Bulk Overwrite Global Application Commands** — Takes a list of application commands, overwriting the existing global command list for this application. (`rest_bulk_set_application_commands`)
    - **Bulk Overwrite Guild Application Commands** — Takes a list of application commands, overwriting the existing command list for this application for the targeted guild. (`rest_bulk_set_guild_application_commands`)
    - **Create Global Application Command** — Create a new global command. (`rest_create_application_command`)
    - **Create Guild Application Command** — Create a new guild command. (`rest_create_guild_application_command`)
    - **Create Interaction Response** — Create a response to an Interaction. (`rest_create_interaction_response`)
    - **Delete Global Application Command** — Deletes a global command. (`rest_delete_application_command`)
    - **Delete Current User Application Role Connection** — Deletes the application role connection for the user. (`rest_delete_application_user_role_connection`)
    - **Delete Guild Application Command** — Delete a guild command. (`rest_delete_guild_application_command`)
    - **Get Application** — Returns an application by its ID. (`rest_get_application`)
    - **Get Global Application Command** — Fetch a global command for your application. (`rest_get_application_command`)
    - **Get Application Role Connection Metadata Records** — Returns a list of application role connection metadata objects for the given application. (`rest_get_application_role_connections_metadata`)
    - **Get Current User Application Role Connection** — Returns the application role connection for the user. (`rest_get_application_user_role_connection`)
    - **Get Gateway Bot** — Returns an object based on the information in Get Gateway, plus additional metadata that can help during the operation of large or sharded bots. (`rest_get_bot_gateway`)
    - **Get Gateway** — Returns an object with a valid WSS URL which the app can use when Connecting to the Gateway. (`rest_get_gateway`)
    - **Get Guild Application Command** — Fetch a guild command for your application. (`rest_get_guild_application_command`)
    - **Get Application Command Permissions** — Fetches permissions for a specific command for your application in a guild. (`rest_get_guild_application_command_permissions`)
    - **Get Current Application** — Returns the application object associated with the requesting bot user. (`rest_get_my_application`)
    - **Get Current Bot Application Information** — Returns the bot's application object. (`rest_get_my_oauth2_application`)
    - **Get Global Application Commands** — Fetch all of the global commands for your application. (`rest_list_application_commands`)
    - **Get Guild Application Command Permissions** — Fetches permissions for all commands for your application in a guild. (`rest_list_guild_application_command_permissions`)
    - **Get Guild Application Commands** — Fetch all of the guild commands for your application for a specific guild. (`rest_list_guild_application_commands`)
    - **Edit Application Command Permissions** — Edits command permissions for a specific command for your application in a guild and returns a guild application command permissions object. (`rest_set_guild_application_command_permissions`)
    - **Modify Application** — Changes an application by its ID. (`rest_update_application`)
    - **Edit Global Application Command** — Edit a global command. (`rest_update_application_command`)
    - **Update Application Role Connection Metadata Records** — Updates and returns a list of application role connection metadata objects for the given application. (`rest_update_application_role_connections_metadata`)
    - **Update Current User Application Role Connection** — Updates and returns the application role connection for the user. (`rest_update_application_user_role_connection`)
    - **Edit Guild Application Command** — Edit a guild command. (`rest_update_guild_application_command`)
    - **Edit Current Application** — Edit properties of the app associated with the requesting bot user. (`rest_update_my_application`)
    - **Upload Application Attachment** — Uploads a file as an attachment of the application. (`rest_upload_application_attachment`)
  collapsible: true
- component_id: steps_lobbies
  type: markdown
  title: Lobbies and Social SDK (23)
  body: |
    Lobbies, provisional accounts and application identities of the Discord Social SDK.

    - **Add a Member to a Lobby** — Adds the provided user to the specified lobby. (`rest_add_lobby_member`)
    - **Social SDK Token (Bot)** — Exchanges an external account's credentials for a Discord provisional account token, authorized with the bot token (Discord Social SDK). (`rest_bot_partner_sdk_token`)
    - **Unmerge Provisional Account (Bot)** — Separates a provisional account from the Discord account it was merged into, authorized with the bot token (Discord Social SDK). (`rest_bot_partner_sdk_unmerge_provisional_account`)
    - **Bulk Update Lobby Members** — Adds, updates, or removes up to 25 members from the specified lobby in a single request. (`rest_bulk_update_lobby_members`)
    - **Create Lobby Channel Invite for Self** — Creates a single-use guild invite to the lobby's linked channel, targeted at the calling user. (`rest_create_linked_lobby_guild_invite_for_self`)
    - **Create Lobby Channel Invite for User** — Creates a single-use guild invite to the lobby's linked channel on behalf of an application, targeted at the specified user. (`rest_create_linked_lobby_guild_invite_for_user`)
    - **Create Lobby** — Creates a new lobby, adding any of the specified members to it, if provided. (`rest_create_lobby`)
    - **Send Lobby Message** — Sends a message to the specified lobby. (`rest_create_lobby_message`)
    - **Create or Join Lobby** — Creates a new lobby for the application identified by a secret, or joins the calling user to the existing lobby with that secret if one already exists. (`rest_create_or_join_lobby`)
    - **Delete Application Identity** — Deletes one Application Identity and its associated profile data for the specified user and application. (`rest_delete_application_identity`)
    - **Delete Lobby** — Deletes the specified lobby if it exists. (`rest_delete_lobby`)
    - **Remove a Member from a Lobby** — Removes the provided user from the specified lobby. (`rest_delete_lobby_member`)
    - **Modify Lobby** — Modifies the specified lobby with new values, if provided. (`rest_edit_lobby`)
    - **Link Channel to Lobby** — Links an existing text channel to a lobby. (`rest_edit_lobby_channel_link`)
    - **Get Application Identity Profile** — Returns the Application Identity Profile object stored on the matching Application Identity for the specified user and application. (`rest_get_application_identity_profile`)
    - **Get Lobby** — Returns a lobby object for the specified lobby id, if it exists. (`rest_get_lobby`)
    - **Get Lobby Messages** — Returns the most recent messages in the specified lobby. (`rest_get_lobby_messages`)
    - **Leave Lobby** — Removes the current user from the specified lobby. (`rest_leave_lobby`)
    - **Get Application Identities by External ID** — Returns the application identities for the user/application record currently associated with the specified external ID (combination of provider_type, provider_issued_user_id, and optional provider_id). (`rest_list_application_identities_by_external_id`)
    - **Get Application Identities by User ID** — Returns the application identities for the specified user and application. (`rest_list_application_identities_by_user_id`)
    - **Social SDK Token** — Exchanges an external account's credentials for a Discord provisional account token (Discord Social SDK). (`rest_partner_sdk_token`)
    - **Unmerge Provisional Account** — Separates a provisional account from the Discord account it was merged into (Discord Social SDK). (`rest_partner_sdk_unmerge_provisional_account`)
    - **Update Application Identity Profile** — Updates the profile data on the user's matching Application Identity record. (`rest_update_application_identity_profile`)
  collapsible: true
- component_id: steps_monetization
  type: markdown
  title: Monetization (9)
  body: |
    SKUs, entitlements and subscriptions.

    - **Consume an Entitlement** — For One-Time Purchase consumable SKUs, marks a given entitlement for the user as consumed. (`rest_consume_entitlement`)
    - **Create Test Entitlement** — Creates a test entitlement to a given SKU for a given guild or user. (`rest_create_entitlement`)
    - **Delete Test Entitlement** — Deletes a currently-active test entitlement. (`rest_delete_entitlement`)
    - **Get Current User Application Entitlements** — Returns the authorized user's entitlements for an application. (`rest_get_current_user_application_entitlements`)
    - **Get Entitlement** — Returns an entitlement. (`rest_get_entitlement`)
    - **List Entitlements** — Returns all entitlements for a given app, active and expired. (`rest_get_entitlements`)
    - **Get SKU Subscription** — Get a subscription by its ID. (`rest_get_sku_subscription`)
    - **List SKU Subscriptions** — Returns all subscriptions containing the SKU, filtered by user. (`rest_get_sku_subscriptions`)
    - **List SKUs** — Returns all SKUs for a given application. (`rest_list_application_skus`)
  collapsible: true
- component_id: steps_users
  type: markdown
  title: Users and OAuth2 (11)
  body: |
    The current user, their servers, connections and DMs, and OAuth2 information.

    - **Create DM** — Create a new DM channel with a user. (`rest_create_dm`)
    - **Get Current User Guild Member** — Returns a guild member object for the current user. (`rest_get_my_guild_member`)
    - **Get Current Authorization Information** — Returns info about the current authorization. (`rest_get_my_oauth2_authorization`)
    - **Get Current User** — Returns the user object of the requester's account. (`rest_get_my_user`)
    - **Get OpenID Connect User Info** — Returns the OpenID Connect user information of the authorized user. (`rest_get_openid_connect_userinfo`)
    - **Get OAuth2 Public Keys** — Returns Discord's OAuth2 public signing keys (a JSON Web Key Set). (`rest_get_public_keys`)
    - **Get User** — Returns a user object for a given user ID. (`rest_get_user`)
    - **Leave Guild** — Leave a guild. (`rest_leave_guild`)
    - **Get Current User Connections** — Returns a list of connection objects. (`rest_list_my_connections`)
    - **Get Current User Guilds** — Returns a list of partial guild objects the current user is a member of. (`rest_list_my_guilds`)
    - **Modify Current User** — Modify the requester's user account settings. (`rest_update_my_user`)
  collapsible: true
