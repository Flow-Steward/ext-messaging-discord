components:
- component_id: steps_messages
  type: markdown
  title: Messages
  body: |
    Send, read, edit, pin and delete messages, reactions and polls.

    ### Create Reaction

    Create a reaction for the message. This endpoint requires the READ_MESSAGE_HISTORY permission to be present on the current user. Additionally, if nobody else has reacted to the message using this emoji, this endpoint requires the ADD_REACTIONS permission to be present on the current user. Returns a 204 empty response on success. Fires a Message Reaction Add Gateway event. Discord: PUT /channels/{channel_id}/messages/{message_id}/reactions/{emoji_name}/@me.

    Action id `rest_add_my_message_reaction` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `message_id`, `emoji_name`, `audit_reason`.

    ### Bulk Delete Messages

    Delete multiple messages in a single request. This endpoint can only be used on guild channels and requires the MANAGE_MESSAGES permission. Returns a 204 empty response on success. Fires a Message Delete Bulk Gateway event. Discord: POST /channels/{channel_id}/messages/bulk-delete.

    Action id `rest_bulk_delete_messages` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `body`, `audit_reason`.

    ### Create Message

    Post a message to a guild text or DM channel. Returns a message object. Fires a Message Create Gateway event. See message formatting for more information on how to properly format messages. Discord: POST /channels/{channel_id}/messages.

    Action id `rest_create_message` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `body`, `media_type`, `files`, `file_artifacts`, `audit_reason`.

    ### Pin Message

    Pin a message in a channel. Requires the PIN_MESSAGES permission. Fires a Channel Pins Update Gateway event. Discord: PUT /channels/{channel_id}/messages/pins/{message_id}.

    Action id `rest_create_pin` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `message_id`, `audit_reason`.

    ### Start Thread from Message

    Creates a new thread from an existing message. Returns a channel on success, and a 400 BAD REQUEST on invalid parameters. Fires a Thread Create and a Message Update Gateway event. Discord: POST /channels/{channel_id}/messages/{message_id}/threads.

    Action id `rest_create_thread_from_message` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `message_id`, `body`, `audit_reason`.

    ### Crosspost Message

    Crosspost a message in an Announcement Channel to following channels. This endpoint requires the SEND_MESSAGES permission, if the current user sent the message, or additionally the MANAGE_MESSAGES permission, for all other messages, to be present for the current user. Discord: POST /channels/{channel_id}/messages/{message_id}/crosspost.

    Action id `rest_crosspost_message` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `message_id`, `audit_reason`.

    ### Delete All Reactions

    Deletes all reactions on a message. This endpoint requires the MANAGE_MESSAGES permission to be present on the current user. Fires a Message Reaction Remove All Gateway event. Discord: DELETE /channels/{channel_id}/messages/{message_id}/reactions.

    Action id `rest_delete_all_message_reactions` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `message_id`, `audit_reason`.

    ### Delete All Reactions for Emoji

    Deletes all the reactions for a given emoji on a message. This endpoint requires the MANAGE_MESSAGES permission to be present on the current user. Fires a Message Reaction Remove Emoji Gateway event. The emoji must be URL Encoded or the request will fail with 10014: Unknown Emoji. To use custom emoji, you must encode it in the format name:id with the emoji name and emoji id. Discord: DELETE /channels/{channel_id}/messages/{message_id}/reactions/{emoji_name}.

    Action id `rest_delete_all_message_reactions_by_emoji` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `message_id`, `emoji_name`, `audit_reason`.

    ### Delete Message

    Delete a message. If operating on a guild channel and trying to delete a message that was not sent by the current user, this endpoint requires the MANAGE_MESSAGES permission. Returns a 204 empty response on success. Fires a Message Delete Gateway event. Discord: DELETE /channels/{channel_id}/messages/{message_id}.

    Action id `rest_delete_message` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `message_id`, `audit_reason`.

    ### Delete Own Reaction

    Delete a reaction the current user has made for the message. Returns a 204 empty response on success. Fires a Message Reaction Remove Gateway event. The emoji must be URL Encoded or the request will fail with 10014: Unknown Emoji. To use custom emoji, you must encode it in the format name:id with the emoji name and emoji id. Discord: DELETE /channels/{channel_id}/messages/{message_id}/reactions/{emoji_name}/@me.

    Action id `rest_delete_my_message_reaction` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `message_id`, `emoji_name`, `audit_reason`.

    ### Unpin Message

    Unpin a message in a channel. Requires the PIN_MESSAGES permission. Returns a 204 empty response on success. Fires a Channel Pins Update Gateway event. Discord: DELETE /channels/{channel_id}/messages/pins/{message_id}.

    Action id `rest_delete_pin` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `message_id`, `audit_reason`.

    ### Delete User Reaction

    Deletes another user's reaction. This endpoint requires the MANAGE_MESSAGES permission to be present on the current user. Returns a 204 empty response on success. Fires a Message Reaction Remove Gateway event. The emoji must be URL Encoded or the request will fail with 10014: Unknown Emoji. To use custom emoji, you must encode it in the format name:id with the emoji name and emoji id. Discord: DELETE /channels/{channel_id}/messages/{message_id}/reactions/{emoji_name}/{user_id}.

    Action id `rest_delete_user_message_reaction` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `message_id`, `emoji_name`, `user_id`, `audit_reason`.

    ### Pin Message (deprecated)

    This endpoint is deprecated. Use Pin Message instead. Discord: PUT /channels/{channel_id}/pins/{message_id}.

    Action id `rest_deprecated_create_pin` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `message_id`, `audit_reason`.

    ### Unpin Message (deprecated)

    This endpoint is deprecated. Use Unpin Message instead. Discord: DELETE /channels/{channel_id}/pins/{message_id}.

    Action id `rest_deprecated_delete_pin` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `message_id`, `audit_reason`.

    ### Get Pinned Messages (deprecated)

    Gets the first 50 pinned messages in a channel, returning an array of message objects on success. This endpoint is deprecated. Use Get Channel Pins instead. Discord: GET /channels/{channel_id}/pins.

    Action id `rest_deprecated_list_pins` · reads only · connection: bot

    Inputs: `channel_id`.

    ### Get Answer Voters

    Get a list of users that voted for this specific answer. Discord: GET /channels/{channel_id}/polls/{message_id}/answers/{answer_id}. With all_pages it reads every page (after the step's cursor, or from the first item without one) and returns next_cursor to pass as after when the list did not end.

    Action id `rest_get_answer_voters` · reads only · connection: bot

    Inputs: `channel_id`, `message_id`, `answer_id`, `after`, `limit`, `all_pages`.

    ### Get Channel Message

    Retrieves a specific message in the channel. Returns a message object on success. Discord: GET /channels/{channel_id}/messages/{message_id}.

    Action id `rest_get_message` · reads only · connection: bot

    Inputs: `channel_id`, `message_id`.

    ### Search Guild Messages

    Returns a list of messages without the reactions key that match a search query in the guild. Requires the READ_MESSAGE_HISTORY permission. Discord: GET /guilds/{guild_id}/messages/search.

    Action id `rest_guild_search` · reads only · connection: bot, OAuth2 token

    Inputs: `guild_id`, `attachment_extension`, `attachment_filename`, `author_id`, `author_type`, `channel_id`, `content`, `embed_provider`, `embed_type`, `has`, `include_nsfw`, `limit`, `link_hostname`, `max_id`, `mention_everyone`, `mentions`, `mentions_role_id`, `min_id`, `offset`, `pinned`, `replied_to_message_id`, `replied_to_user_id`, `slop`, `sort_by`, `sort_order`.

    ### Get Reactions

    Get a list of users that reacted with this emoji. Returns an array of user objects on success. The emoji must be URL Encoded or the request will fail with 10014: Unknown Emoji. To use custom emoji, you must encode it in the format name:id with the emoji name and emoji id. Discord: GET /channels/{channel_id}/messages/{message_id}/reactions/{emoji_name}. With all_pages it reads every page (after the step's cursor, or from the first item without one) and returns next_cursor to pass as after when the list did not end.

    Action id `rest_list_message_reactions_by_emoji` · reads only · connection: bot

    Inputs: `channel_id`, `message_id`, `emoji_name`, `after`, `limit`, `type`, `all_pages`.

    ### Get Channel Messages

    Retrieves the messages in a channel. Returns an array of message objects from newest to oldest on success. Discord: GET /channels/{channel_id}/messages. With all_pages it reads every page (before the step's cursor, or from the newest item without one) and returns next_cursor to pass as before when the list did not end.

    Action id `rest_list_messages` · reads only · connection: bot, OAuth2 token

    Inputs: `channel_id`, `after`, `around`, `before`, `limit`, `all_pages`.

    ### Get Channel Pins

    Retrieves the list of pins in a channel. Requires the VIEW_CHANNEL permission. If the user is missing the READ_MESSAGE_HISTORY permission in the channel, then no pins will be returned. Discord: GET /channels/{channel_id}/messages/pins. With all_pages it reads every page (before the step's cursor, or from the newest item without one) and returns next_cursor to pass as before when the list did not end.

    Action id `rest_list_pins` · reads only · connection: bot

    Inputs: `channel_id`, `before`, `limit`, `all_pages`.

    ### End Poll

    Immediately ends the poll. You cannot end polls from other users. Discord: POST /channels/{channel_id}/polls/{message_id}/expire.

    Action id `rest_poll_expire` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `message_id`, `audit_reason`.

    ### Edit Message

    Edit a previously sent message. The fields content, embeds, flags and components can be edited by the original message author. Other users can only edit flags and only if they have the MANAGE_MESSAGES permission in the corresponding channel. When specifying flags, ensure to include all previously set flags/bits in addition to ones that you are modifying. Discord: PATCH /channels/{channel_id}/messages/{message_id}.

    Action id `rest_update_message` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `message_id`, `body`, `media_type`, `files`, `file_artifacts`, `audit_reason`.
