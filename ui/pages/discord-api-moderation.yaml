components:
- component_id: steps_moderation
  type: markdown
  title: Moderation and audit log
  body: |
    Bans, pruning, join requests, auto moderation rules and the audit log.

    ### Action Guild Join Request

    Approve or reject guild join request. Discord: PATCH /guilds/{guild_id}/requests/{request_id}.

    Action id `rest_action_guild_join_request` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `request_id`, `body`, `audit_reason`.

    ### Create Guild Ban

    Create a guild ban, and optionally delete previous messages sent by the banned user. Requires the BAN_MEMBERS permission. Returns a 204 empty response on success. Fires a Guild Ban Add Gateway event. Discord: PUT /guilds/{guild_id}/bans/{user_id}.

    Action id `rest_ban_user_from_guild` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `user_id`, `body`, `audit_reason`.

    ### Bulk Guild Ban

    Ban up to 200 users from a guild, and optionally delete previous messages sent by the banned users. Requires both the BAN_MEMBERS and MANAGE_GUILD permissions. Returns a 200 response on success, including the fields banned_users with the IDs of the banned users and failed_users with IDs that could not be banned or were already banned. Discord: POST /guilds/{guild_id}/bulk-ban.

    Action id `rest_bulk_ban_users_from_guild` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Create Auto Moderation Rule

    Create a new rule. Returns an auto moderation rule on success. Fires an Auto Moderation Rule Create Gateway event. Discord: POST /guilds/{guild_id}/auto-moderation/rules.

    Action id `rest_create_auto_moderation_rule` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Delete Auto Moderation Rule

    Delete a rule. Returns a 204 on success. Fires an Auto Moderation Rule Delete Gateway event. Discord: DELETE /guilds/{guild_id}/auto-moderation/rules/{rule_id}.

    Action id `rest_delete_auto_moderation_rule` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `rule_id`, `audit_reason`.

    ### Get Auto Moderation Rule

    Get a single rule. Returns an auto moderation rule object. Discord: GET /guilds/{guild_id}/auto-moderation/rules/{rule_id}.

    Action id `rest_get_auto_moderation_rule` · reads only · connection: bot

    Inputs: `guild_id`, `rule_id`.

    ### Get Guild Ban

    Returns a ban object for the given user or a 404 not found if the ban cannot be found. Requires the BAN_MEMBERS or VIEW_AUDIT_LOG permission. Discord: GET /guilds/{guild_id}/bans/{user_id}.

    Action id `rest_get_guild_ban` · reads only · connection: bot

    Inputs: `guild_id`, `user_id`.

    ### Get Guild Join Requests

    List join requests for guild, optionally filtered by application status. Discord: GET /guilds/{guild_id}/requests. With all_pages it reads every page (after the step's cursor, or from the first item without one) and returns next_cursor to pass as after when the list did not end.

    Action id `rest_get_guild_join_requests` · reads only · connection: bot

    Inputs: `guild_id`, `after`, `before`, `limit`, `status`, `all_pages`.

    ### List Auto Moderation Rules for Guild

    Get a list of all rules currently configured for the guild. Returns a list of auto moderation rule objects for the given guild. Discord: GET /guilds/{guild_id}/auto-moderation/rules.

    Action id `rest_list_auto_moderation_rules` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Get Guild Audit Log

    Returns an audit log object for the guild. Requires the VIEW_AUDIT_LOG permission. Discord: GET /guilds/{guild_id}/audit-logs. With all_pages it reads every page (before the step's cursor, or from the newest item without one) and returns next_cursor to pass as before when the list did not end.

    Action id `rest_list_guild_audit_log_entries` · reads only · connection: bot

    Inputs: `guild_id`, `action_type`, `after`, `before`, `limit`, `target_id`, `user_id`, `all_pages`.

    ### Get Guild Bans

    Returns a list of ban objects for the users banned from this guild. Requires the BAN_MEMBERS or VIEW_AUDIT_LOG permission. Discord: GET /guilds/{guild_id}/bans. With all_pages it reads every page (after the step's cursor, or from the first item without one) and returns next_cursor to pass as after when the list did not end.

    Action id `rest_list_guild_bans` · reads only · connection: bot

    Inputs: `guild_id`, `after`, `before`, `limit`, `all_pages`.

    ### Get Guild Prune Count

    Returns an object with one pruned key indicating the number of members that would be removed in a prune operation. Requires the MANAGE_GUILD and KICK_MEMBERS permissions, unless the guild has the PRUNE_REQUIRES_ADMIN guild feature, in which case it requires the ADMINISTRATOR permission. Discord: GET /guilds/{guild_id}/prune.

    Action id `rest_preview_prune_guild` · reads only · connection: bot

    Inputs: `guild_id`, `days`, `include_roles`.

    ### Begin Guild Prune

    Begin a prune operation. Requires the MANAGE_GUILD and KICK_MEMBERS permissions, unless the guild has the PRUNE_REQUIRES_ADMIN guild feature, in which case it requires the ADMINISTRATOR permission. Returns an object with one pruned key indicating the number of members that were removed in the prune operation. For large guilds it's recommended to set the compute_prune_count option to false, forcing pruned to null. Discord: POST /guilds/{guild_id}/prune.

    Action id `rest_prune_guild` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Remove Guild Ban

    Remove the ban for a user. Requires the BAN_MEMBERS permissions. Returns a 204 empty response on success. Fires a Guild Ban Remove Gateway event. Discord: DELETE /guilds/{guild_id}/bans/{user_id}.

    Action id `rest_unban_user_from_guild` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `user_id`, `body`, `audit_reason`.

    ### Modify Auto Moderation Rule

    Modify an existing rule. Returns an auto moderation rule on success. Fires an Auto Moderation Rule Update Gateway event. Discord: PATCH /guilds/{guild_id}/auto-moderation/rules/{rule_id}.

    Action id `rest_update_auto_moderation_rule` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `rule_id`, `body`, `audit_reason`.

    ### Update Lobby Message Moderation Metadata

    Sets the moderation metadata for a lobby message. The metadata is app-scoped and delivered to active game clients via the Social SDK as a realtime message update. See Integrate Moderation for the full moderation flow. Discord: PUT /lobbies/{lobby_id}/messages/{message_id}/moderation-metadata.

    Action id `rest_update_lobby_message_external_moderation_metadata` · changes data in Discord · connection: bot

    Inputs: `lobby_id`, `message_id`, `body`, `media_type`, `files`, `file_artifacts`, `audit_reason`.

    ### Update User Message Moderation Metadata

    Update the external moderation metadata for a user message (DM). Discord: PUT /partner-sdk/dms/{user_id_1}/{user_id_2}/messages/{message_id}/moderation-metadata.

    Action id `rest_update_user_message_external_moderation_metadata` · changes data in Discord · connection: bot

    Inputs: `user_id_1`, `user_id_2`, `message_id`, `body`, `media_type`, `files`, `file_artifacts`, `audit_reason`.
