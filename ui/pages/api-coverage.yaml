- component_id: coverage_summary
  type: markdown
  title: Coverage
  body: |
    The pinned Discord API description (discord-api-spec) lists 250 operations, and Discord's API documentation (discord-api-docs) 8 more: **all 258 have their own step**.

    - **111 reads** and **147 changes**. Test runs never send changes.
    - **17 list steps** read all pages with `all_pages`; **15 steps** send files (up to 20 MiB each).

    Steps by group:

    - Messages: 23
    - Channels and threads: 39
    - Servers and members: 42
    - Roles: 9
    - Moderation and audit log: 17
    - Webhooks: 18
    - Emojis, stickers and sounds: 25
    - Scheduled events: 11
    - Applications, commands and interactions: 31
    - Lobbies and Social SDK: 23
    - Monetization: 9
    - Users and OAuth2: 11

    From the documentation only: `rest_batch_edit_application_command_permissions`, `rest_delete_application_identity`, `rest_get_application_identity_profile`, `rest_list_application_identities_by_external_id`, `rest_list_application_identities_by_user_id`, `rest_list_application_skus`, `rest_modify_current_user_nick`, `rest_update_application_identity_profile`.

    Disabled by Discord: `rest_batch_edit_application_command_permissions` (Batch Edit Application Command Permissions). Discord turned it off with command permissions v2; the step answers `operation_disabled` without calling Discord.

    Delivered by Discord's other transports:

    - **Incoming interactions** (slash commands, buttons, modals): Discord sends each one to the application's own endpoint and expects the first answer within 3 seconds, with the token of that event. Followups go through the webhook steps with an interaction token.
    - **Gateway events** arrive over Discord's WebSocket connection, and **voice** over its voice connections; the REST steps read and change the same servers, channels and messages.

    Everyday steps on top: Test connection, Send message, Get channel, List channel messages, Get server, List server channels. Two archived pickers (`discord_rest_read`, `discord_rest_write`) stay for workflows made before the dedicated steps.
