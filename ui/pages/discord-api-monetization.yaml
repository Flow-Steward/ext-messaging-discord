  type: markdown
  title: Monetization
  body: |
    SKUs, entitlements and subscriptions.

    ### Consume an Entitlement

    For One-Time Purchase consumable SKUs, marks a given entitlement for the user as consumed. The entitlement will have consumed: true when using List Entitlements. Discord: POST /applications/{application_id}/entitlements/{entitlement_id}/consume.

    Action id `rest_consume_entitlement` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `application_id`, `entitlement_id`, `audit_reason`.

    ### Create Test Entitlement

    Creates a test entitlement to a given SKU for a given guild or user. Discord will act as though that user or guild has entitlement to your premium offering. Discord: POST /applications/{application_id}/entitlements.

    Action id `rest_create_entitlement` · changes data in Discord · connection: bot

    Inputs: `application_id`, `body`, `audit_reason`.

    ### Delete Test Entitlement

    Deletes a currently-active test entitlement. Discord will act as though that user or guild _no longer has_ entitlement to your premium offering. Discord: DELETE /applications/{application_id}/entitlements/{entitlement_id}.

    Action id `rest_delete_entitlement` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `application_id`, `entitlement_id`, `audit_reason`.

    ### Get Current User Application Entitlements

    Returns the authorized user's entitlements for an application. Discord: GET /users/@me/applications/{application_id}/entitlements.

    Action id `rest_get_current_user_application_entitlements` · reads only · connection: OAuth2 token

    Inputs: `application_id`, `exclude_consumed`, `sku_ids`.

    ### Get Entitlement

    Returns an entitlement. Discord: GET /applications/{application_id}/entitlements/{entitlement_id}.

    Action id `rest_get_entitlement` · reads only · connection: bot, OAuth2 token

    Inputs: `application_id`, `entitlement_id`.

    ### List Entitlements

    Returns all entitlements for a given app, active and expired. Discord: GET /applications/{application_id}/entitlements. With all_pages it reads every page (after the step's cursor, or from the first item without one) and returns next_cursor to pass as after when the list did not end.

    Action id `rest_get_entitlements` · reads only · connection: bot, OAuth2 token

    Inputs: `application_id`, `after`, `before`, `exclude_deleted`, `exclude_ended`, `guild_id`, `limit`, `only_active`, `sku_ids`, `user_id`, `all_pages`.

    ### Get SKU Subscription

    Get a subscription by its ID. Returns a subscription object. Discord: GET /skus/{sku_id}/subscriptions/{subscription_id}.

    Action id `rest_get_sku_subscription` · reads only · connection: bot, OAuth2 token

    Inputs: `sku_id`, `subscription_id`, `user_id`.

    ### List SKU Subscriptions

    Returns all subscriptions containing the SKU, filtered by user. Returns a list of subscription objects. Discord: GET /skus/{sku_id}/subscriptions. With all_pages it reads every page (after the step's cursor, or from the first item without one) and returns next_cursor to pass as after when the list did not end.

    Action id `rest_get_sku_subscriptions` · reads only · connection: bot, OAuth2 token

    Inputs: `sku_id`, `after`, `before`, `limit`, `user_id`, `all_pages`.

    ### List SKUs

    Returns all SKUs for a given application. Discord: GET /applications/{application_id}/skus.

    Action id `rest_list_application_skus` · reads only · connection: bot

    Inputs: `application_id`.
