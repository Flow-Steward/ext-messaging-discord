components:
- component_id: steps_channels
  type: markdown
  title: Channels and threads
  body: |
    Read, create and change channels, threads, permissions, invites and stage instances.

    ### Group DM Add Recipient

    Adds a recipient to a Group DM using their access token. Discord: PUT /channels/{channel_id}/recipients/{user_id}.

    Action id `rest_add_group_dm_user` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `user_id`, `body`, `audit_reason`.

    ### Add Target User

    Adds a target user to an existing invite. Requires the caller to be the inviter or have the MANAGE_GUILD permission. Returns a 204 empty response on success. Discord: PUT /invites/{code}/target-users/{user_id}.

    Action id `rest_add_invite_target_user` · changes data in Discord · connection: bot

    Inputs: `code`, `user_id`, `audit_reason`.

    ### Add Thread Member

    Adds another member to a thread. Requires the ability to send messages in the thread. Also requires the thread is not archived. Returns a 204 empty response if the member is successfully added or was already a member of the thread. Fires a Thread Members Update Gateway event. Discord: PUT /channels/{channel_id}/thread-members/{user_id}.

    Action id `rest_add_thread_member` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `user_id`, `audit_reason`.

    ### Bulk-Add Target Users

    Adds multiple target users to an existing invite. Requires the caller to be the inviter or have the MANAGE_GUILD permission. Returns a 204 empty response on success. Discord: POST /invites/{code}/target-users/bulk-add.

    Action id `rest_bulk_add_invite_target_users` · changes data in Discord · connection: bot

    Inputs: `code`, `body`, `audit_reason`.

    ### Bulk-Delete Target Users

    Removes multiple target users from an existing invite. Requires the caller to be the inviter or have the MANAGE_GUILD permission. Returns a 204 empty response on success. Discord: POST /invites/{code}/target-users/bulk-delete.

    Action id `rest_bulk_remove_invite_target_users` · changes data in Discord · connection: bot

    Inputs: `code`, `body`, `audit_reason`.

    ### Create Channel Invite

    Create a new invite object for the channel. Only usable for guild channels. Requires the CREATE_INSTANT_INVITE permission. All JSON parameters for this route are optional, however the request body is not. If you are not sending any fields, you still have to send an empty JSON object ({}). Returns an invite object. Fires an Invite Create Gateway event. Discord: POST /channels/{channel_id}/invites.

    Action id `rest_create_channel_invite` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `body`, `media_type`, `files`, `file_artifacts`, `audit_reason`.

    ### Create Stage Instance

    Creates a new Stage instance associated to a Stage channel. Returns that Stage instance. Fires a Stage Instance Create Gateway event. Discord: POST /stage-instances.

    Action id `rest_create_stage_instance` · changes data in Discord · connection: bot

    Inputs: `body`, `audit_reason`.

    ### Start Thread without Message

    Creates a new thread that is not connected to an existing message. Returns a channel on success, and a 400 BAD REQUEST on invalid parameters. Fires a Thread Create Gateway event. Discord: POST /channels/{channel_id}/threads.

    Action id `rest_create_thread` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `body`, `media_type`, `files`, `file_artifacts`, `audit_reason`.

    ### Delete/Close Channel

    Delete a channel, or close a private message. Requires the MANAGE_CHANNELS permission for the guild, or MANAGE_THREADS if the channel is a thread. Deleting a category does not delete its child channels; they will have their parent_id removed and a Channel Update Gateway event will fire for each of them. Returns a channel object on success. Discord: DELETE /channels/{channel_id}.

    Action id `rest_delete_channel` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `audit_reason`.

    ### Delete Channel Permission

    Delete a channel permission overwrite for a user or role in a channel. Only usable for guild channels. Requires the MANAGE_ROLES permission. Returns a 204 empty response on success. Fires a Channel Update Gateway event. For more information about permissions, see permissions Discord: DELETE /channels/{channel_id}/permissions/{overwrite_id}.

    Action id `rest_delete_channel_permission_overwrite` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `overwrite_id`, `audit_reason`.

    ### Group DM Remove Recipient

    Removes a recipient from a Group DM. Discord: DELETE /channels/{channel_id}/recipients/{user_id}.

    Action id `rest_delete_group_dm_user` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `user_id`, `audit_reason`.

    ### Delete Stage Instance

    Deletes the Stage instance. Returns 204 No Content. Fires a Stage Instance Delete Gateway event. Discord: DELETE /stage-instances/{channel_id}.

    Action id `rest_delete_stage_instance` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `audit_reason`.

    ### Remove Thread Member

    Removes another member from a thread. Requires the MANAGE_THREADS permission, or the creator of the thread if it is a PRIVATE_THREAD. Also requires the thread is not archived. Returns a 204 empty response on success. Fires a Thread Members Update Gateway event. Discord: DELETE /channels/{channel_id}/thread-members/{user_id}.

    Action id `rest_delete_thread_member` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `user_id`, `audit_reason`.

    ### Follow Announcement Channel

    Follow an Announcement Channel to send messages to a target channel. Requires the MANAGE_WEBHOOKS permission in the target channel. Returns a followed channel object. Fires a Webhooks Update Gateway event for the target channel. Discord: POST /channels/{channel_id}/followers.

    Action id `rest_follow_channel` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `body`, `audit_reason`.

    ### List Active Guild Threads

    Returns all active threads in the guild, including public and private threads. Threads are ordered by their id, in descending order. Discord: GET /guilds/{guild_id}/threads/active.

    Action id `rest_get_active_guild_threads` · reads only · connection: bot

    Inputs: `guild_id`.

    ### Get Channel

    Get a channel by ID. Returns a channel object. If the channel is a thread, a thread member object is included in the returned result. Discord: GET /channels/{channel_id}.

    Action id `rest_get_channel` · reads only · connection: bot

    Inputs: `channel_id`.

    ### Get Channel Member Permissions

    Returns the member's computed permissions in the channel, including their roles and member-specific overwrites. Threads use their parent channel's overwrites. Requires the VIEW_CHANNEL permission, and additionally CONNECT for voice and stage channels. Discord: GET /channels/{channel_id}/permissions/member/{user_id}.

    Action id `rest_get_channel_member_permissions` · reads only · connection: bot

    Inputs: `channel_id`, `user_id`, `implicit`.

    ### Get Channel Role Permissions

    Returns the permissions granted by the specified role together with @everyone, applying their channel overwrites. Other roles and member-specific overwrites are not included. Threads use their parent channel's overwrites. Requires the VIEW_CHANNEL permission, and additionally CONNECT for voice and stage channels. Discord: GET /channels/{channel_id}/permissions/role/{role_id}.

    Action id `rest_get_channel_role_permissions` · reads only · connection: bot

    Inputs: `channel_id`, `role_id`, `implicit`.

    ### Get Target Users

    Gets the users allowed to see and accept this invite. Response is a CSV file with the header user_id and each user ID on its own line. Requires the caller to be the inviter, or have MANAGE_GUILD permission, or have VIEW_AUDIT_LOG permission. Discord: GET /invites/{code}/target-users.

    Action id `rest_get_invite_target_users` · reads only · connection: bot

    Inputs: `code`.

    ### Get Target Users Job Status

    Processing target users from a CSV when creating or updating an invite is done asynchronously. This endpoint allows you to check the status of that job. Requires the caller to be the inviter, or have MANAGE_GUILD permission, or have VIEW_AUDIT_LOG permission. Discord: GET /invites/{code}/target-users/job-status.

    Action id `rest_get_invite_target_users_job_status` · reads only · connection: bot

    Inputs: `code`.

    ### Get Stage Instance

    Gets the stage instance associated with the Stage channel, if it exists. Discord: GET /stage-instances/{channel_id}.

    Action id `rest_get_stage_instance` · reads only · connection: bot

    Inputs: `channel_id`.

    ### Get Thread Member

    Returns a thread member object for the specified user if they are a member of the thread, returns a 404 response otherwise. Discord: GET /channels/{channel_id}/thread-members/{user_id}.

    Action id `rest_get_thread_member` · reads only · connection: bot

    Inputs: `channel_id`, `user_id`, `with_member`.

    ### Get Invite

    Returns an invite object for the given code. Discord: GET /invites/{code}.

    Action id `rest_invite_resolve` · reads only · connection: bot

    Inputs: `code`, `guild_scheduled_event_id`, `target_channel_id`, `target_message_id`, `with_counts`.

    ### Delete Invite

    Delete an invite. Requires the MANAGE_CHANNELS permission on the channel this invite belongs to, or MANAGE_GUILD to remove any invite across the guild. Returns an invite object on success. Fires an Invite Delete Gateway event. Discord: DELETE /invites/{code}.

    Action id `rest_invite_revoke` · changes data in Discord · connection: bot

    Inputs: `code`, `audit_reason`.

    ### Join Thread

    Adds the current user to a thread. Also requires the thread is not archived. Returns a 204 empty response on success. Fires a Thread Members Update and a Thread Create Gateway event. Discord: PUT /channels/{channel_id}/thread-members/@me.

    Action id `rest_join_thread` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `audit_reason`.

    ### Leave Thread

    Removes the current user from a thread. Also requires the thread is not archived. Returns a 204 empty response on success. Fires a Thread Members Update Gateway event. Discord: DELETE /channels/{channel_id}/thread-members/@me.

    Action id `rest_leave_thread` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `audit_reason`.

    ### Get Channel Invites

    Returns a list of invite objects (with invite metadata) for the channel. Only usable for guild channels. Requires the MANAGE_CHANNELS permission. Discord: GET /channels/{channel_id}/invites.

    Action id `rest_list_channel_invites` · reads only · connection: bot

    Inputs: `channel_id`.

    ### List Joined Private Archived Threads

    Returns archived threads in the channel that are of type PRIVATE_THREAD, and the user has joined. Threads are ordered by their id, in descending order. Requires the READ_MESSAGE_HISTORY permission. Discord: GET /channels/{channel_id}/users/@me/threads/archived/private. With all_pages it reads every page (before the step's cursor, or from the newest item without one) and returns next_cursor to pass as before when the list did not end.

    Action id `rest_list_my_private_archived_threads` · reads only · connection: bot

    Inputs: `channel_id`, `before`, `limit`, `all_pages`.

    ### List Private Archived Threads

    Returns archived threads in the channel that are of type PRIVATE_THREAD. Threads are ordered by archive_timestamp, in descending order. Requires both the READ_MESSAGE_HISTORY and MANAGE_THREADS permissions. Discord: GET /channels/{channel_id}/threads/archived/private. With all_pages it reads every page (before the step's cursor, or from the newest item without one) and returns next_cursor to pass as before when the list did not end.

    Action id `rest_list_private_archived_threads` · reads only · connection: bot

    Inputs: `channel_id`, `before`, `limit`, `all_pages`.

    ### List Public Archived Threads

    Returns archived threads in the channel that are public. When called on a GUILD_TEXT channel, returns threads of type PUBLIC_THREAD. When called on a GUILD_ANNOUNCEMENT channel returns threads of type ANNOUNCEMENT_THREAD. Threads are ordered by archive_timestamp, in descending order. Requires the READ_MESSAGE_HISTORY permission. Discord: GET /channels/{channel_id}/threads/archived/public. With all_pages it reads every page (before the step's cursor, or from the newest item without one) and returns next_cursor to pass as before when the list did not end.

    Action id `rest_list_public_archived_threads` · reads only · connection: bot

    Inputs: `channel_id`, `before`, `limit`, `all_pages`.

    ### List Thread Members

    Returns array of thread members objects that are members of the thread. Discord: GET /channels/{channel_id}/thread-members. With all_pages it reads every page (after the step's cursor, or from the first item without one) and returns next_cursor to pass as after when the list did not end.

    Action id `rest_list_thread_members` · reads only · connection: bot

    Inputs: `channel_id`, `after`, `limit`, `with_member`, `all_pages`.

    ### Remove Target User

    Removes a target user from an existing invite. Requires the caller to be the inviter or have the MANAGE_GUILD permission. Returns a 204 empty response on success. Discord: DELETE /invites/{code}/target-users/{user_id}.

    Action id `rest_remove_invite_target_user` · changes data in Discord · connection: bot

    Inputs: `code`, `user_id`, `audit_reason`.

    ### Edit Channel Permissions

    Edit the channel permission overwrites for a user or role in a channel. Only usable for guild channels. Requires the MANAGE_ROLES permission. Only permissions your bot has in the guild or parent channel (if applicable) can be allowed/denied (unless your bot has a MANAGE_ROLES overwrite in the channel). Returns a 204 empty response on success. Fires a Channel Update Gateway event. Discord: PUT /channels/{channel_id}/permissions/{overwrite_id}.

    Action id `rest_set_channel_permission_overwrite` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `overwrite_id`, `body`, `audit_reason`.

    ### Search Threads

    Searches the threads of a channel. Discord: GET /channels/{channel_id}/threads/search.

    Action id `rest_thread_search` · reads only · connection: bot

    Inputs: `channel_id`, `archived`, `limit`, `max_id`, `min_id`, `name`, `offset`, `slop`, `sort_by`, `sort_order`, `tag`, `tag_setting`.

    ### Trigger Typing Indicator

    Post a typing indicator for the specified channel, which expires after 10 seconds. Returns a 204 empty response on success. Fires a Typing Start Gateway event. Discord: POST /channels/{channel_id}/typing.

    Action id `rest_trigger_typing_indicator` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `audit_reason`.

    ### Modify Channel

    Update a channel's settings. Returns a channel on success, and a 400 BAD REQUEST on invalid parameters. Discord: PATCH /channels/{channel_id}.

    Action id `rest_update_channel` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `body`, `audit_reason`.

    ### Update Target Users

    Updates the users allowed to see and accept this invite. Uploading a file with invalid user IDs will result in a 400 with the invalid IDs described. Requires the caller to be the inviter or have the MANAGE_GUILD permission. Discord: PUT /invites/{code}/target-users.

    Action id `rest_update_invite_target_users` · changes data in Discord · connection: bot

    Inputs: `code`, `body`, `files`, `file_artifacts`, `audit_reason`.

    ### Modify Stage Instance

    Updates fields of an existing Stage instance. Returns the updated Stage instance. Fires a Stage Instance Update Gateway event. Discord: PATCH /stage-instances/{channel_id}.

    Action id `rest_update_stage_instance` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `body`, `audit_reason`.

    ### Set Voice Channel Status

    Set a voice channel's status. Requires the SET_VOICE_CHANNEL_STATUS permission, and additionally the MANAGE_CHANNELS permission if the current user is not connected to the voice channel. Users who are connected to the voice channel do not need the CONNECT permission (see Implicit Permissions). Fires a Voice Channel Status Update Gateway event. Discord: PUT /channels/{channel_id}/voice-status.

    Action id `rest_update_voice_channel_status` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `body`, `audit_reason`.
