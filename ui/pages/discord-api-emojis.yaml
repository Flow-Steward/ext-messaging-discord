- component_id: steps_emojis
  type: markdown
  title: Emojis, stickers and sounds
  body: |
    Server and application emojis, stickers and soundboard sounds.

    ### Create Application Emoji

    Create a new emoji for the application. Returns the new emoji object on success. Discord: POST /applications/{application_id}/emojis.

    Action id `rest_create_application_emoji` · changes data in Discord · connection: bot

    Inputs: `application_id`, `body`, `audit_reason`.

    ### Create Guild Emoji

    Create a new emoji for the guild. Requires the CREATE_GUILD_EXPRESSIONS permission. Returns the new emoji object on success. Fires a Guild Emojis Update Gateway event. Discord: POST /guilds/{guild_id}/emojis.

    Action id `rest_create_guild_emoji` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Create Guild Soundboard Sound

    Create a new soundboard sound for the guild. Requires the CREATE_GUILD_EXPRESSIONS permission. Returns the new soundboard sound object on success. Fires a Guild Soundboard Sound Create Gateway event. Discord: POST /guilds/{guild_id}/soundboard-sounds.

    Action id `rest_create_guild_soundboard_sound` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `audit_reason`.

    ### Create Guild Sticker

    Create a new sticker for the guild. Send a multipart/form-data body as described in Uploading Files. Requires the CREATE_GUILD_EXPRESSIONS permission. Returns the new sticker object on success. Fires a Guild Stickers Update Gateway event. Discord: POST /guilds/{guild_id}/stickers.

    Action id `rest_create_guild_sticker` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `body`, `files`, `file_artifacts`, `audit_reason`.

    ### Delete Application Emoji

    Delete the given emoji. Returns 204 No Content on success. Discord: DELETE /applications/{application_id}/emojis/{emoji_id}.

    Action id `rest_delete_application_emoji` · changes data in Discord · connection: bot

    Inputs: `application_id`, `emoji_id`, `audit_reason`.

    ### Delete Guild Emoji

    Delete the given emoji. For emojis created by the current user, requires either the CREATE_GUILD_EXPRESSIONS or MANAGE_GUILD_EXPRESSIONS permission. For other emojis, requires the MANAGE_GUILD_EXPRESSIONS permission. Returns 204 No Content on success. Fires a Guild Emojis Update Gateway event. Discord: DELETE /guilds/{guild_id}/emojis/{emoji_id}.

    Action id `rest_delete_guild_emoji` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `emoji_id`, `audit_reason`.

    ### Delete Guild Soundboard Sound

    Delete the given soundboard sound. For sounds created by the current user, requires either the CREATE_GUILD_EXPRESSIONS or MANAGE_GUILD_EXPRESSIONS permission. For other sounds, requires the MANAGE_GUILD_EXPRESSIONS permission. Returns 204 No Content on success. Fires a Guild Soundboard Sound Delete Gateway event. Discord: DELETE /guilds/{guild_id}/soundboard-sounds/{sound_id}.

    Action id `rest_delete_guild_soundboard_sound` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `sound_id`, `audit_reason`.

    ### Delete Guild Sticker

    Delete the given sticker. For stickers created by the current user, requires either the CREATE_GUILD_EXPRESSIONS or MANAGE_GUILD_EXPRESSIONS permission. For other stickers, requires the MANAGE_GUILD_EXPRESSIONS permission. Returns 204 No Content on success. Fires a Guild Stickers Update Gateway event. Discord: DELETE /guilds/{guild_id}/stickers/{sticker_id}.

    Action id `rest_delete_guild_sticker` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `sticker_id`, `audit_reason`.

    ### Get Application Emoji

    Returns an emoji object for the given application and emoji IDs. Includes the user field. Discord: GET /applications/{application_id}/emojis/{emoji_id}.

    Action id `rest_get_application_emoji` · reads only · connection: bot

    Inputs: `application_id`, `emoji_id`.

    ### Get Guild Emoji

    Returns an emoji object for the given guild and emoji IDs. Includes the user field if the bot has the MANAGE_GUILD_EXPRESSIONS permission, or if the bot created the emoji and has the CREATE_GUILD_EXPRESSIONS permission. Discord: GET /guilds/{guild_id}/emojis/{emoji_id}.

    Action id `rest_get_guild_emoji` · reads only · connection: bot

    Inputs: `guild_id`, `emoji_id`.

    ### Get Guild Soundboard Sound

    Returns a soundboard sound object for the given sound id. Includes the user field if the bot has the CREATE_GUILD_EXPRESSIONS or MANAGE_GUILD_EXPRESSIONS permission. Discord: GET /guilds/{guild_id}/soundboard-sounds/{sound_id}.

    Action id `rest_get_guild_soundboard_sound` · reads only · connection: bot

    Inputs: `guild_id`, `sound_id`.

    ### Get Guild Sticker

    Returns a sticker object for the given guild and sticker IDs. Includes the user field if the bot has the CREATE_GUILD_EXPRESSIONS or MANAGE_GUILD_EXPRESSIONS permission. Discord: GET /guilds/{guild_id}/stickers/{sticker_id}.

    Action id `rest_get_guild_sticker` · reads only · connection: bot

    Inputs: `guild_id`, `sticker_id`.

    ### List Default Soundboard Sounds

    Returns an array of soundboard sound objects that can be used by all users. Discord: GET /soundboard-default-sounds.

    Action id `rest_get_soundboard_default_sounds` · reads only · connection: bot

    Inputs: none.

    ### Get Sticker

    Returns a sticker object for the given sticker ID. Discord: GET /stickers/{sticker_id}.

    Action id `rest_get_sticker` · reads only · connection: bot

    Inputs: `sticker_id`.

    ### Get Sticker Pack

    Returns a sticker pack object for the given sticker pack ID. Discord: GET /sticker-packs/{pack_id}.

    Action id `rest_get_sticker_pack` · reads only · connection: bot

    Inputs: `pack_id`.

    ### List Application Emojis

    Returns an object containing a list of emoji objects for the given application under the items key. Includes a user object for the team member that uploaded the emoji from the app's settings, or for the bot user if uploaded using the API. Discord: GET /applications/{application_id}/emojis.

    Action id `rest_list_application_emojis` · reads only · connection: bot

    Inputs: `application_id`.

    ### List Guild Emojis

    Returns a list of emoji objects for the given guild. Includes user fields if the bot has the CREATE_GUILD_EXPRESSIONS or MANAGE_GUILD_EXPRESSIONS permission. Discord: GET /guilds/{guild_id}/emojis.

    Action id `rest_list_guild_emojis` · reads only · connection: bot

    Inputs: `guild_id`.

    ### List Guild Soundboard Sounds

    Returns a list of the guild's soundboard sounds. Includes user fields if the bot has the CREATE_GUILD_EXPRESSIONS or MANAGE_GUILD_EXPRESSIONS permission. Discord: GET /guilds/{guild_id}/soundboard-sounds.

    Action id `rest_list_guild_soundboard_sounds` · reads only · connection: bot

    Inputs: `guild_id`.

    ### List Guild Stickers

    Returns an array of sticker objects for the given guild. Includes user fields if the bot has the CREATE_GUILD_EXPRESSIONS or MANAGE_GUILD_EXPRESSIONS permission. Discord: GET /guilds/{guild_id}/stickers.

    Action id `rest_list_guild_stickers` · reads only · connection: bot

    Inputs: `guild_id`.

    ### List Sticker Packs

    Returns a list of available sticker packs. Discord: GET /sticker-packs.

    Action id `rest_list_sticker_packs` · reads only · connection: bot

    Inputs: none.

    ### Send Soundboard Sound

    Send a soundboard sound to a voice channel the user is connected to. Fires a Voice Channel Effect Send Gateway event. Discord: POST /channels/{channel_id}/send-soundboard-sound.

    Action id `rest_send_soundboard_sound` · changes data in Discord · connection: bot

    Inputs: `channel_id`, `body`, `audit_reason`.

    ### Modify Application Emoji

    Modify the given emoji. Returns the updated emoji object on success. Discord: PATCH /applications/{application_id}/emojis/{emoji_id}.

    Action id `rest_update_application_emoji` · changes data in Discord · connection: bot

    Inputs: `application_id`, `emoji_id`, `body`, `audit_reason`.

    ### Modify Guild Emoji

    Modify the given emoji. For emojis created by the current user, requires either the CREATE_GUILD_EXPRESSIONS or MANAGE_GUILD_EXPRESSIONS permission. For other emojis, requires the MANAGE_GUILD_EXPRESSIONS permission. Returns the updated emoji object on success. Fires a Guild Emojis Update Gateway event. Discord: PATCH /guilds/{guild_id}/emojis/{emoji_id}.

    Action id `rest_update_guild_emoji` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `emoji_id`, `body`, `audit_reason`.

    ### Modify Guild Soundboard Sound

    Modify the given soundboard sound. For sounds created by the current user, requires either the CREATE_GUILD_EXPRESSIONS or MANAGE_GUILD_EXPRESSIONS permission. For other sounds, requires the MANAGE_GUILD_EXPRESSIONS permission. Returns the updated soundboard sound object on success. Fires a Guild Soundboard Sound Update Gateway event. Discord: PATCH /guilds/{guild_id}/soundboard-sounds/{sound_id}.

    Action id `rest_update_guild_soundboard_sound` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `sound_id`, `body`, `audit_reason`.

    ### Modify Guild Sticker

    Modify the given sticker. For stickers created by the current user, requires either the CREATE_GUILD_EXPRESSIONS or MANAGE_GUILD_EXPRESSIONS permission. For other stickers, requires the MANAGE_GUILD_EXPRESSIONS permission. Returns the updated sticker object on success. Fires a Guild Stickers Update Gateway event. Discord: PATCH /guilds/{guild_id}/stickers/{sticker_id}.

    Action id `rest_update_guild_sticker` · changes data in Discord · connection: bot

    Inputs: `guild_id`, `sticker_id`, `body`, `audit_reason`.
