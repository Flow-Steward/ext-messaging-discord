- component_id: steps_applications
  type: markdown
  title: Applications, commands and interactions
  body: |
    The application itself, its slash commands and permissions, role connections, interaction responses and the Gateway address.

    ### Get Application Activity Instance

    Returns a serialized activity instance, if it exists. Useful for preventing unwanted activity sessions. Discord: GET /applications/{application_id}/activity-instances/{instance_id}.

    Action id `rest_applications_get_activity_instance` · reads only · connection: bot

    Inputs: `application_id`, `instance_id`.

    ### Batch Edit Application Command Permissions

    This endpoint has been disabled with updates to command permissions (Permissions v2). Instead, you can edit each application command permissions (though you should be careful to handle any potential rate limits). Discord: PUT /applications/{application_id}/guilds/{guild_id}/commands/permissions.

    Action id `rest_batch_edit_application_command_permissions` · changes data in Discord · connection: OAuth2 token · disabled by Discord, the step answers operation_disabled

    Inputs: `application_id`, `guild_id`, `audit_reason`.

    ### Bulk Overwrite Global Application Commands

    Takes a list of application commands, overwriting the existing global command list for this application. Returns 200 and a list of application command objects. Commands that do not already exist will count toward daily application command create limits. Discord: PUT /applications/{application_id}/commands.

    Action id `rest_bulk_set_application_commands` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `application_id`, `body`, `audit_reason`.

    ### Bulk Overwrite Guild Application Commands

    Takes a list of application commands, overwriting the existing command list for this application for the targeted guild. Returns 200 and a list of application command objects. Discord: PUT /applications/{application_id}/guilds/{guild_id}/commands.

    Action id `rest_bulk_set_guild_application_commands` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `application_id`, `guild_id`, `body`, `audit_reason`.

    ### Create Global Application Command

    Create a new global command. Returns 201 if a command with the same name does not already exist, or a 200 if it does (in which case the previous command will be overwritten). Both responses include an application command object. Discord: POST /applications/{application_id}/commands.

    Action id `rest_create_application_command` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `application_id`, `body`, `audit_reason`.

    ### Create Guild Application Command

    Create a new guild command. New guild commands will be available in the guild immediately. Returns 201 if a command with the same name does not already exist, or a 200 if it does (in which case the previous command will be overwritten). Both responses include an application command object. Discord: POST /applications/{application_id}/guilds/{guild_id}/commands.

    Action id `rest_create_guild_application_command` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `application_id`, `guild_id`, `body`, `audit_reason`.

    ### Create Interaction Response

    Create a response to an Interaction. Body is an interaction response. Returns 204 unless with_response is set to true which returns 200 with the body as interaction callback response. Discord: POST /interactions/{interaction_id}/{interaction_token}/callback.

    Action id `rest_create_interaction_response` · changes data in Discord · connection: webhook or interaction token

    Inputs: `interaction_id`, `with_response`, `body`, `media_type`, `files`, `file_artifacts`, `audit_reason`.

    ### Delete Global Application Command

    Deletes a global command. Returns 204 No Content on success. Discord: DELETE /applications/{application_id}/commands/{command_id}.

    Action id `rest_delete_application_command` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `application_id`, `command_id`, `audit_reason`.

    ### Delete Current User Application Role Connection

    Deletes the application role connection for the user. Requires an OAuth2 access token with role_connections.write scope for the application specified in the path. Discord: DELETE /users/@me/applications/{application_id}/role-connection.

    Action id `rest_delete_application_user_role_connection` · changes data in Discord · connection: OAuth2 token

    Inputs: `application_id`, `audit_reason`.

    ### Delete Guild Application Command

    Delete a guild command. Returns 204 No Content on success. Discord: DELETE /applications/{application_id}/guilds/{guild_id}/commands/{command_id}.

    Action id `rest_delete_guild_application_command` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `application_id`, `guild_id`, `command_id`, `audit_reason`.

    ### Get Application

    Returns an application by its ID. Discord: GET /applications/{application_id}.

    Action id `rest_get_application` · reads only · connection: bot

    Inputs: `application_id`.

    ### Get Global Application Command

    Fetch a global command for your application. Returns an application command object. Discord: GET /applications/{application_id}/commands/{command_id}.

    Action id `rest_get_application_command` · reads only · connection: bot, OAuth2 token

    Inputs: `application_id`, `command_id`.

    ### Get Application Role Connection Metadata Records

    Returns a list of application role connection metadata objects for the given application. Discord: GET /applications/{application_id}/role-connections/metadata.

    Action id `rest_get_application_role_connections_metadata` · reads only · connection: bot

    Inputs: `application_id`.

    ### Get Current User Application Role Connection

    Returns the application role connection for the user. Requires an OAuth2 access token with role_connections.write scope for the application specified in the path. Discord: GET /users/@me/applications/{application_id}/role-connection.

    Action id `rest_get_application_user_role_connection` · reads only · connection: OAuth2 token

    Inputs: `application_id`.

    ### Get Gateway Bot

    Returns an object based on the information in Get Gateway, plus additional metadata that can help during the operation of large or sharded bots. Unlike the Get Gateway, this route should not be cached for extended periods of time as the value is not guaranteed to be the same per-call, and changes as the bot joins/leaves guilds. Discord: GET /gateway/bot.

    Action id `rest_get_bot_gateway` · reads only · connection: bot

    Inputs: none.

    ### Get Gateway

    Returns an object with a valid WSS URL which the app can use when Connecting to the Gateway. Apps should cache this value and only call this endpoint to retrieve a new URL when they are unable to properly establish a connection using the cached one. Discord: GET /gateway.

    Action id `rest_get_gateway` · reads only · connection: bot

    Inputs: none.

    ### Get Guild Application Command

    Fetch a guild command for your application. Returns an application command object. Discord: GET /applications/{application_id}/guilds/{guild_id}/commands/{command_id}.

    Action id `rest_get_guild_application_command` · reads only · connection: bot, OAuth2 token

    Inputs: `application_id`, `guild_id`, `command_id`.

    ### Get Application Command Permissions

    Fetches permissions for a specific command for your application in a guild. Returns a guild application command permissions object. Discord: GET /applications/{application_id}/guilds/{guild_id}/commands/{command_id}/permissions.

    Action id `rest_get_guild_application_command_permissions` · reads only · connection: bot, OAuth2 token

    Inputs: `application_id`, `guild_id`, `command_id`.

    ### Get Current Application

    Returns the application object associated with the requesting bot user. Discord: GET /applications/@me.

    Action id `rest_get_my_application` · reads only · connection: bot

    Inputs: none.

    ### Get Current Bot Application Information

    Returns the bot's application object. Discord: GET /oauth2/applications/@me.

    Action id `rest_get_my_oauth2_application` · reads only · connection: bot

    Inputs: none.

    ### Get Global Application Commands

    Fetch all of the global commands for your application. Returns an array of application command objects. Discord: GET /applications/{application_id}/commands.

    Action id `rest_list_application_commands` · reads only · connection: bot, OAuth2 token

    Inputs: `application_id`, `with_localizations`.

    ### Get Guild Application Command Permissions

    Fetches permissions for all commands for your application in a guild. Returns an array of guild application command permissions objects. Discord: GET /applications/{application_id}/guilds/{guild_id}/commands/permissions.

    Action id `rest_list_guild_application_command_permissions` · reads only · connection: bot, OAuth2 token

    Inputs: `application_id`, `guild_id`.

    ### Get Guild Application Commands

    Fetch all of the guild commands for your application for a specific guild. Returns an array of application command objects. Discord: GET /applications/{application_id}/guilds/{guild_id}/commands.

    Action id `rest_list_guild_application_commands` · reads only · connection: bot, OAuth2 token

    Inputs: `application_id`, `guild_id`, `with_localizations`.

    ### Edit Application Command Permissions

    Edits command permissions for a specific command for your application in a guild and returns a guild application command permissions object. Fires an Application Command Permissions Update Gateway event. Discord: PUT /applications/{application_id}/guilds/{guild_id}/commands/{command_id}/permissions.

    Action id `rest_set_guild_application_command_permissions` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `application_id`, `guild_id`, `command_id`, `body`, `audit_reason`.

    ### Modify Application

    Changes an application by its ID. Discord: PATCH /applications/{application_id}.

    Action id `rest_update_application` · changes data in Discord · connection: bot

    Inputs: `application_id`, `body`, `audit_reason`.

    ### Edit Global Application Command

    Edit a global command. Returns 200 and an application command object. All fields are optional, but any fields provided will entirely overwrite the existing values of those fields. Discord: PATCH /applications/{application_id}/commands/{command_id}.

    Action id `rest_update_application_command` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `application_id`, `command_id`, `body`, `audit_reason`.

    ### Update Application Role Connection Metadata Records

    Updates and returns a list of application role connection metadata objects for the given application. Discord: PUT /applications/{application_id}/role-connections/metadata.

    Action id `rest_update_application_role_connections_metadata` · changes data in Discord · connection: bot

    Inputs: `application_id`, `body`, `audit_reason`.

    ### Update Current User Application Role Connection

    Updates and returns the application role connection for the user. Requires an OAuth2 access token with role_connections.write scope for the application specified in the path. Discord: PUT /users/@me/applications/{application_id}/role-connection.

    Action id `rest_update_application_user_role_connection` · changes data in Discord · connection: OAuth2 token

    Inputs: `application_id`, `body`, `audit_reason`.

    ### Edit Guild Application Command

    Edit a guild command. Updates for guild commands will be available immediately. Returns 200 and an application command object. All fields are optional, but any fields provided will entirely overwrite the existing values of those fields. Discord: PATCH /applications/{application_id}/guilds/{guild_id}/commands/{command_id}.

    Action id `rest_update_guild_application_command` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `application_id`, `guild_id`, `command_id`, `body`, `audit_reason`.

    ### Edit Current Application

    Edit properties of the app associated with the requesting bot user. Only properties that are passed will be updated. Returns the updated application object on success. Discord: PATCH /applications/@me.

    Action id `rest_update_my_application` · changes data in Discord · connection: bot

    Inputs: `body`, `audit_reason`.

    ### Upload Application Attachment

    Uploads a file as an attachment of the application. Discord: POST /applications/{application_id}/attachment.

    Action id `rest_upload_application_attachment` · changes data in Discord · connection: bot, OAuth2 token

    Inputs: `application_id`, `body`, `files`, `file_artifacts`, `audit_reason`.
